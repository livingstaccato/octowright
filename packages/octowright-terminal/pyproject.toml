[build-system]
# Pinned to match the root octowright pyproject.toml: hatchling>=1.32 emits
# Metadata-Version 2.5, which pypa/gh-action-pypi-publish v1.14.0's bundled
# validator rejects outright. See the root pyproject.toml [build-system]
# comment for the confirmed repro.
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[project]
name = "octowright-terminal"
# Deliberately its own version line, not core's. This is a separate
# distribution with its own maturity, and locking the two would force a
# plugin release on every core release even when nothing here changed.
version = "0.1.0"
description = "Terminal session kind for octowright (PTY, SSH, telnet), as a session-kind plugin."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSES/*"]
authors = [
    { name = "Tim Perkins", email = "code@tim.life" },
    { name = "provide.io", email = "code@provide.io" },
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "octowright",
    "terminal",
    "pty",
    "ssh",
    "telnet",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = [
    # 0.17.0 is the first core release carrying `octowright.plugins`, the only
    # module this package imports from core's plugin machinery. Against an
    # older core the install resolves fine and then dies at daemon start with
    # `ModuleNotFoundError: No module named 'octowright.plugins'` -- a floor is
    # the only thing that turns that into a resolver error the user can read.
    "octowright>=0.17.0",
    # [ssh] not [gateway]: `provide.uterm.server.connectors.ssh` imports
    # asyncssh at module scope and raises ImportError without it. The extra
    # that supplies asyncssh is declared on the BASE `provide-uterm` package
    # (`ssh = ["asyncssh>=2.14"]`), not on `provide-uterm-server` -- which has
    # no `ssh` extra at all; the extra that happens to pull in asyncssh there
    # is `[gateway]`, which also drags in fastapi/uvicorn/websockets for the
    # bridge/tunnel/gateway machinery this package never uses (it only touches
    # `provide.uterm.server.connectors`, per the terminal-sessions design doc).
    # `provide-uterm[ssh]` is the minimal, correctly-scoped way to get asyncssh.
    # Floors are the oldest versions actually published to PyPI, which are also
    # the only ones this package has been tested against. The previous >=0.4.0
    # floors named releases that never existed there.
    "provide-uterm[ssh]>=0.5.1",
    "provide-uterm-platform>=0.5.0",
    "provide-uterm-server>=0.5.0",
]

# The only interface between core and this package. Core resolves the name from
# OCTOWRIGHT_PLUGINS and loads this attribute; nothing else is imported.
[project.entry-points."octowright.session_kinds"]
terminal = "octowright_terminal.plugin:plugin"

[project.urls]
Homepage = "https://github.com/livingstaccato/octowright"
Documentation = "https://foundry.provide.io/octowright/"
Repository = "https://github.com/livingstaccato/octowright"
Issues = "https://github.com/livingstaccato/octowright/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/octowright_terminal"]
