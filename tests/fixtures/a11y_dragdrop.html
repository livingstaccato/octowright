<!doctype html>
<meta charset="utf-8">
<title>a11y dragdrop fixture</title>
<style>
  li { padding: 4px; border: 1px solid #ccc; margin: 2px; list-style: none; }
  [aria-grabbed="true"] { background: #ffd; }
  .bin { padding: 4px; border: 1px solid #ccc; margin: 2px; }
  .bin.active { outline: 2px solid #06c; }
</style>

<h1>Arrow-key sortable list</h1>
<ul id="list">
  <li id="a" tabindex="0" aria-grabbed="false">Alpha</li>
  <li id="b" tabindex="0" aria-grabbed="false">Bravo</li>
  <li id="c" tabindex="0" aria-grabbed="false">Charlie</li>
</ul>
<p id="status"></p>

<h1>Tab-cycle bins</h1>
<div id="bins">
  <button id="t-item" aria-grabbed="false">Widget</button>
  <div class="bin active" id="bin-1">Bin 1</div>
  <div class="bin" id="bin-2">Bin 2</div>
  <div class="bin" id="bin-3">Bin 3</div>
</div>
<p id="bin-status"></p>

<script>
  // Minimal WAI-ARIA APG keyboard drag: Space grabs, arrows move the grabbed
  // item, Space drops, Escape cancels. Deliberately vanilla so the test has no
  // external dependency and runs headless in CI.
  let grabbed = null;
  document.addEventListener("keydown", (e) => {
    const el = document.activeElement;
    if (!el || el.tagName !== "LI") return;
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      if (grabbed === el) {
        grabbed.setAttribute("aria-grabbed", "false");
        document.getElementById("status").textContent = "dropped " + grabbed.id;
        grabbed = null;
      } else {
        grabbed = el;
        el.setAttribute("aria-grabbed", "true");
        document.getElementById("status").textContent = "grabbed " + el.id;
      }
    } else if (grabbed && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      const list = document.getElementById("list");
      const sib = e.key === "ArrowDown" ? grabbed.nextElementSibling : grabbed.previousElementSibling;
      if (sib) {
        if (e.key === "ArrowDown") list.insertBefore(sib, grabbed);
        else list.insertBefore(grabbed, sib);
        grabbed.focus();
      }
    } else if (e.key === "Escape" && grabbed) {
      grabbed.setAttribute("aria-grabbed", "false");
      document.getElementById("status").textContent = "cancelled";
      grabbed = null;
    }
  });

  // The OTHER half of the APG keyboard drag pattern, and the one the tool
  // defaults to: navigation by Tab / Shift+Tab rather than by arrow keys.
  // Focus deliberately STAYS on the grabbed item (every navigation key is
  // preventDefault-ed) and a separate "active bin" pointer moves instead --
  // which is what makes the tool's default grabbed-predicate
  // (`document.activeElement === el`) meaningful for a Tab-navigated widget.
  // Home/End jump to the first/last bin so an explicit `nav_key_sequence`
  // ("keys" mode) has heterogeneous, order-sensitive keys to send.
  let binGrabbed = false;
  let binIndex = 0;
  const bins = () => Array.from(document.querySelectorAll("#bins .bin"));
  const setBin = (next) => {
    const all = bins();
    binIndex = (next + all.length) % all.length;
    all.forEach((bin, i) => bin.classList.toggle("active", i === binIndex));
  };
  document.addEventListener("keydown", (e) => {
    const item = document.getElementById("t-item");
    if (document.activeElement !== item) return;
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      if (binGrabbed) {
        binGrabbed = false;
        item.setAttribute("aria-grabbed", "false");
        document.getElementById("bin-status").textContent = "dropped into " + bins()[binIndex].id;
      } else {
        binGrabbed = true;
        item.setAttribute("aria-grabbed", "true");
        setBin(0);
        document.getElementById("bin-status").textContent = "grabbed";
      }
    } else if (!binGrabbed) {
      return;
    } else if (e.key === "Tab") {
      e.preventDefault();
      setBin(binIndex + (e.shiftKey ? -1 : 1));
    } else if (e.key === "Home" || e.key === "End") {
      e.preventDefault();
      setBin(e.key === "End" ? bins().length - 1 : 0);
    } else if (e.key === "Escape") {
      e.preventDefault();
      binGrabbed = false;
      item.setAttribute("aria-grabbed", "false");
      document.getElementById("bin-status").textContent = "cancelled";
    }
  });
</script>
