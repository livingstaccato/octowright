<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Catalog</title>
<style>
 body{font:16px system-ui;margin:24px;max-width:640px} h1{font-size:22px}
 .item{border:1px solid #ccc;border-radius:8px;margin:8px 0}
 .row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer}
 .name{font-weight:600} .details{display:none;padding:0 16px 12px;color:#333}
 .item.open .details{display:block}
 form{margin-top:24px;padding:16px;border:1px solid #ccc;border-radius:8px}
 label{display:block;margin:8px 0 4px} input{padding:6px 8px;font-size:15px;width:240px}
 button{margin-top:12px;padding:8px 16px} #msg{margin-top:12px;font-weight:600;color:#0a7d33}
</style></head><body>
<h1>Provide Goods — Catalog</h1><div id="list"></div>
<form id="order" onsubmit="placeOrder(event)"><h2>Quick order</h2>
 <label for="product">Product name</label><input id="product" name="product" autocomplete="off">
 <label for="qty">Quantity</label><input id="qty" name="qty" type="number" value="1" min="1">
 <button type="submit">Place order</button><div id="msg" role="status"></div></form>
<script>
const P=[{name:"Aurora Desk Lamp",price:"$42.00",rating:"4.6",desc:"Warm-dimmable LED desk lamp with USB-C."},
{name:"Nimbus Water Bottle",price:"$18.50",rating:"4.2",desc:"600ml insulated stainless bottle."},
{name:"Quartz Wall Clock",price:"$35.00",rating:"4.8",desc:"Silent-sweep 30cm wall clock."},
{name:"Vertex Backpack",price:"$89.00",rating:"4.5",desc:"28L water-resistant commuter pack."},
{name:"Pebble Bluetooth Speaker",price:"$27.00",rating:"4.1",desc:"Pocket speaker, 10h battery."}];
const L=document.getElementById('list');
P.forEach(p=>{const e=document.createElement('div');e.className='item';
 e.innerHTML=`<div class="row"><span class="name">${p.name}</span><button type="button">Details</button></div>
 <div class="details">Price: <b>${p.price}</b> · Rating: <b>${p.rating}</b> / 5<br>${p.desc}</div>`;
 e.querySelector('.row').addEventListener('click',()=>e.classList.toggle('open'));L.appendChild(e);});
function placeOrder(ev){ev.preventDefault();const n=product.value.trim(),q=qty.value;
 msg.textContent=n?`Order placed: ${q} × ${n}`:"Enter a product name.";}
</script></body></html>
