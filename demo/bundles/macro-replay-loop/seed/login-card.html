<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Octowright Replay Loop</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101827;
        color: #f3f4f6;
        font-family: ui-sans-serif, sans-serif;
      }
      .card {
        width: min(28rem, calc(100vw - 3rem));
        padding: 2rem;
        border-radius: 1rem;
        background: #1f2937;
        border: 1px solid #334155;
      }
      .field {
        display: grid;
        gap: 0.35rem;
        margin-top: 1rem;
      }
      label {
        font-size: 0.9rem;
        color: #cbd5e1;
      }
      input {
        border: 1px solid #475569;
        border-radius: 0.8rem;
        padding: 0.8rem 0.9rem;
        background: #0f172a;
        color: #f8fafc;
      }
      button {
        margin-top: 1rem;
        width: 100%;
        border: 0;
        border-radius: 0.8rem;
        padding: 0.9rem 1rem;
        background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
        color: white;
        font-weight: 600;
      }
      #status {
        margin-top: 1rem;
        padding: 0.85rem 1rem;
        border-radius: 0.8rem;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid #334155;
        color: #93c5fd;
      }
      #status[data-state="ok"] {
        color: #bfdbfe;
        border-color: #38bdf8;
      }
      h1 {
        margin-top: 0;
      }
      .hint {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>Replay loop seed</h1>
      <p>This local card mirrors the login-shaped interaction used by the demo macros.</p>
      <p class="hint">Record once, replay many times, compare the same visible state each run.</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" autocomplete="off" value="" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="off" value="" />
      </div>
      <button id="submit" type="button">Log in</button>
      <p id="status" data-state="idle">Waiting for deterministic replay input.</p>
    </section>
    <script>
      const button = document.getElementById("submit");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const status = document.getElementById("status");
      button.addEventListener("click", () => {
        const suffix = email.value.includes("@") ? email.value.split("@")[1] : "offline";
        status.dataset.state = "ok";
        status.textContent = `Replay ready for ${suffix} with ${password.value.length} hidden characters.`;
      });
    </script>
  </body>
</html>
