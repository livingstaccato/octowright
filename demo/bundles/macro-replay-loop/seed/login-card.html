<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Octowright Replay Loop</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101827;
        color: #f3f4f6;
        font-family: ui-sans-serif, sans-serif;
      }
      .card {
        width: min(28rem, calc(100vw - 3rem));
        padding: 2rem;
        border-radius: 1rem;
        background: #1f2937;
        border: 1px solid #334155;
      }
      h1 {
        margin-top: 0;
      }
      .hint {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>Replay loop seed</h1>
      <p>This local card mirrors the login-shaped interaction used by the demo macros.</p>
      <p class="hint">Record once, replay many times, compare the same visible state each run.</p>
    </section>
  </body>
</html>
