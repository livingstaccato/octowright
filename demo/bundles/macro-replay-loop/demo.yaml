id: macro-replay-loop
title: Macro Replay Loop
summary: Record a macro on Wikipedia. Replay it cleanly later. Proof that selectors survive.
hero: true
audiences:
  - evaluators
  - users
  - contributors
tags:
  - hero
  - macros
  - replay
  - real-site
engines:
  - chromium
roles:
  - recorder
  - replayer
source_refs:
  scenarios:
    - examples/scenarios/macro-replay-loop.yaml
  macros:
    - examples/macros/wikipedia-toc-tour.json
artifact_expectations:
  replay:
    - artifacts/replay.jsonl
    - artifacts/replay-roundtrip.jsonl
  video:
    - artifacts/demo.mp4
    - artifacts/poster.png
regen:
  command: uv run python scripts/demos/record_demo.py macro-replay-loop
tutorial_export:
  include: exports/macro-replay-loop.json
recording:
  primary_role: recorder
  macros:
    - name: wikipedia-toc-tour
      role: recorder
    - name: wikipedia-toc-tour
      role: replayer
  extras:
    - replay-roundtrip
