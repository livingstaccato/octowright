id: seven-mix-orchestration
title: Seven Mix Orchestration
summary: Seven players claim tiles on a shared canvas while an operator watches the aggregate live. Nine browsers actually coordinating — not nine empty tabs.
hero: true
audiences:
  - evaluators
  - users
  - contributors
tags:
  - hero
  - orchestration
  - multi-window
  - mixed-engine
engines:
  - chromium
  - firefox
  - webkit
roles:
  - player
  - monitor
  - main-site
source_refs:
  scenarios:
    - examples/scenarios/seven-mix.yaml
  macros:
    - examples/macros/canvas-claim-five.json
artifact_expectations:
  replay:
    - artifacts/replay.jsonl
    - artifacts/participant-roster.json
  video:
    - artifacts/demo.mp4
    - artifacts/poster.png
regen:
  command: uv run python scripts/demos/with_playground.py seven-mix-orchestration
tutorial_export:
  include: exports/seven-mix-orchestration.json
presentation:
  mode: hero-composite
  primary_asset: hero_video
  overlay:
    enabled: true
    style: subtle
    placement: bottom-left
  timing:
    intro_ms: 600
    outro_ms: 2600
    minimum_ms: 9000
  sync_groups:
    - id: orchestration
      roles:
        - player
        - monitor
        - main-site
recording:
  primary_role: player
  macros:
    - name: canvas-claim-five
      role: player
  extras:
    - participant-roster
