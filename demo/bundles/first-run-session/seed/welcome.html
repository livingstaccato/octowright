<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Octowright First Run</title>
    <style>
      body {
        font-family: ui-sans-serif, sans-serif;
        margin: 0;
        padding: 2rem;
        background: linear-gradient(180deg, #f5f7fb 0%, #eef7ff 100%);
        color: #122033;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #d6e0ef;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 20px 50px rgba(18, 32, 51, 0.08);
      }
      .pill {
        display: inline-block;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        background: #d9efff;
        color: #0f4c81;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="pill">offline seed</span>
      <h1>First run, zero network</h1>
      <p>This bundle exists to show the smallest polished Octowright session story.</p>
      <p>Use it when you want a deterministic page to click through before introducing scenarios or replay loops.</p>
    </main>
  </body>
</html>
