id: cross-engine-trio
title: Cross-Engine Trio
summary: Three engines run the same Wikipedia search in parallel. Watch where they agree and where timing differs.
hero: true
audiences:
  - evaluators
  - users
  - contributors
tags:
  - hero
  - engines
  - scenarios
  - real-site
engines:
  - chromium
  - firefox
  - webkit
roles:
  - player
source_refs:
  scenarios:
    - examples/scenarios/cross-engine.yaml
  macros:
    - examples/macros/wikipedia-search.json
artifact_expectations:
  replay:
    - artifacts/replay.jsonl
  video:
    - artifacts/demo.mp4
    - artifacts/poster.png
regen:
  command: uv run python scripts/demos/record_demo.py cross-engine-trio
tutorial_export:
  include: exports/cross-engine-trio.json
presentation:
  mode: sync-multi
  primary_asset: hero_video
  overlay:
    enabled: true
    style: subtle
    placement: bottom-left
  timing:
    intro_ms: 400
    outro_ms: 1800
    minimum_ms: 6500
  sync_groups:
    - id: engines
      roles:
        - player
recording:
  primary_role: player
  macros:
    - name: wikipedia-search
      role: player
