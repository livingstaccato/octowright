id: cross-engine-trio
title: Cross-Engine Trio
summary: Launch Chromium, Firefox, and WebKit against the same deterministic offline target to compare engine behavior at a glance.
hero: true
audiences:
  - evaluators
  - users
  - contributors
tags:
  - hero
  - engines
  - scenarios
  - smoke
engines:
  - chromium
  - firefox
  - webkit
roles:
  - player
source_refs:
  scenarios:
    - examples/scenarios/cross-engine.yaml
  macros:
    - examples/macros/cross-engine-showroom.json
artifact_expectations:
  replay:
    - artifacts/replay.jsonl
  video:
    - artifacts/demo.mp4
    - artifacts/poster.png
regen:
  command: uv run python scripts/demos/record_demo.py cross-engine-trio
tutorial_export:
  include: exports/cross-engine-trio.json
presentation:
  mode: sync-multi
  primary_asset: hero_video
  overlay:
    enabled: true
    style: subtle
    placement: bottom-left
  timing:
    intro_ms: 400
    outro_ms: 1800
    minimum_ms: 6500
  sync_groups:
    - id: engines
      roles:
        - player
seed_refs:
  - seed/engine-grid.html
  - seed/trio-board.html
recording:
  primary_role: player
  default_seed: seed/trio-board.html
  macros:
    - name: cross-engine-showroom
      role: player
