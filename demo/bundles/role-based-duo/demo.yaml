id: role-based-duo
title: Role-Based Duo
summary: Start two coordinated participants and show role-filtered actions against a simple offline scenario.
hero: true
audiences:
  - evaluators
  - users
  - contributors
tags:
  - hero
  - roles
  - scenarios
  - broadcast
engines:
  - webkit
roles:
  - player
  - monitor
source_refs:
  scenarios:
    - examples/scenarios/duo.yaml
  macros:
    - examples/macros/test-smoke-page-ready.json
artifact_expectations:
  replay:
    - artifacts/replay.jsonl
  video:
    - artifacts/demo.mp4
    - artifacts/poster.png
regen:
  command: uv run python scripts/demos/record_demo.py role-based-duo
tutorial_export:
  include: exports/role-based-duo.json
presentation:
  mode: sync-multi
  primary_asset: hero_video
  overlay:
    enabled: true
    style: subtle
    placement: bottom-left
  timing:
    intro_ms: 400
    outro_ms: 1800
    minimum_ms: 6500
  sync_groups:
    - id: roles
      roles:
        - player
        - monitor
seed_refs:
  - seed/control-room.html
  - seed/duo-board.html
recording:
  primary_role: player
  role_seeds:
    player: seed/duo-board.html
    monitor: seed/control-room.html
  macros:
    - name: test-smoke-page-ready
      role: player
