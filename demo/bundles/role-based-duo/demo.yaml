id: role-based-duo
title: Role-Based Duo
summary: One browser drives a 3-step form. A second browser, in a different role, sees each step appear on a live dashboard.
hero: true
audiences:
  - evaluators
  - users
  - contributors
tags:
  - hero
  - roles
  - scenarios
  - broadcast
engines:
  - chromium
roles:
  - player
  - monitor
source_refs:
  scenarios:
    - examples/scenarios/duo.yaml
  macros:
    - examples/macros/form-flow-fill.json
    - examples/macros/dashboard-watch.json
artifact_expectations:
  replay:
    - artifacts/replay.jsonl
  video:
    - artifacts/demo.mp4
    - artifacts/poster.png
regen:
  command: uv run python scripts/demos/with_playground.py role-based-duo
tutorial_export:
  include: exports/role-based-duo.json
presentation:
  mode: sync-multi
  primary_asset: hero_video
  overlay:
    enabled: true
    style: subtle
    placement: bottom-left
  timing:
    intro_ms: 400
    outro_ms: 1800
    minimum_ms: 6500
  sync_groups:
    - id: roles
      roles:
        - player
        - monitor
recording:
  primary_role: player
  macros:
    - name: form-flow-fill
      role: player
    - name: dashboard-watch
      role: monitor
