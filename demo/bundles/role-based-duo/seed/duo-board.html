<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Role-Based Duo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #fff7ed 0%, #ffedd5 100%);
        color: #3b1d0f;
        font-family: ui-sans-serif, sans-serif;
      }
      section {
        width: min(34rem, calc(100vw - 2rem));
        padding: 1.5rem;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #fdba74;
        border-radius: 1rem;
      }
      ul {
        margin: 1rem 0 0;
        padding-left: 1.2rem;
      }
    </style>
  </head>
  <body>
    <section>
      <h1>Player + monitor pairing</h1>
      <p>This seed gives the duo bundle a concrete, offline stage for role-filtered macro runs.</p>
      <ul>
        <li>`player` drives the visible interaction.</li>
        <li>`monitor` observes or validates the shared state.</li>
      </ul>
    </section>
  </body>
</html>
