<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form flow</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="form-root">
  <header>
    <h1>Multi-step form</h1>
    <p>Each <strong>Next</strong> button posts the current step to <code>/api/form-step</code>. The monitor dashboard renders each post as a new row.</p>
  </header>
  <ol id="steps" class="steps">
    <li class="step step--active" data-step="1">
      <h2>Step 1 &mdash; Identity</h2>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="off">
      <button id="next-1" type="button">Next</button>
    </li>
    <li class="step" data-step="2">
      <h2>Step 2 &mdash; Contact</h2>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="off">
      <button id="next-2" type="button">Next</button>
    </li>
    <li class="step" data-step="3">
      <h2>Step 3 &mdash; Confirm</h2>
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes"></textarea>
      <button id="submit" type="button">Submit</button>
    </li>
  </ol>
  <p id="status" class="status" role="status"></p>
</main>
<script src="/form-flow.js"></script>
</body>
</html>
