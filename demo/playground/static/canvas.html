<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Canvas | Octowright Test Range</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page-shell canvas-root">
  <a class="mini-brand" href="/"><img src="/otto.svg" alt="">Octowright Test Range</a>
  <header class="page-header">
    <div class="page-title">
      <h1>Shared Canvas</h1>
      <p>Multiple browsers claim tiles on one shared grid. Every claim broadcasts over SSE so spectators and monitors update live.</p>
    </div>
    <p>
      <span id="role-label">spectator</span>
      <span class="tag"><span id="claim-counter">0</span> claimed</span>
    </p>
  </header>
  <section class="tool-card">
    <div id="grid" class="grid" role="grid" aria-label="claim grid"></div>
    <p class="footnote">
      Set the role via <code>?role=player-N&amp;colour=hex</code>. Player roles can click tiles; spectators watch shared state.
    </p>
  </section>
</main>
<script src="/canvas.js"></script>
</body>
</html>
