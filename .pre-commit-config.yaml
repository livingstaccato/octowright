repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Note: end-of-file-fixer + trailing-whitespace are intentionally NOT included.
      # They strip the trailing blank line of the canonical SPDX block in otherwise-
      # empty __init__.py files, which then fails the SPDX presence check. ruff format
      # handles trailing whitespace + final newline normalization on real source files.
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
        name: ruff format
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        exclude: "uv\\.lock|recordings/|profiles/"

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  - repo: local
    hooks:
      - id: spdx-headers
        name: spdx headers (presence + Apache-2.0 allowlist)
        entry: uv run --active python scripts/check_spdx_headers.py
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: max-loc
        name: max loc (500 lines)
        entry: uv run --active python scripts/check_max_loc.py
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: agent-docs-sync
        name: agent docs sync
        entry: uv run --active python scripts/check_agent_docs_sync.py
        language: system
        pass_filenames: false
        always_run: true

      - id: vulture
        name: vulture (dead code, baseline-ratchet)
        entry: uv run --active python scripts/check_vulture.py
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: xenon
        name: xenon (complexity, baseline-ratchet)
        entry: uv run --active python scripts/check_xenon.py
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: detect-secrets
        name: detect-secrets (baseline-anchored)
        entry: uv run --active detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^(\.secrets\.baseline|uv\.lock)$

      - id: pytest-quick
        name: pytest (unit tests, no live browsers)
        entry: uv run --active pytest -q --deselect tests/test_popup_listeners.py --deselect tests/test_scenarios_live.py tests/
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
        stages: [pre-push]
