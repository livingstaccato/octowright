name: Setup Python CI
description: Standard checkout + act-safe node path + uv setup for octowright CI jobs
runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
    - name: Ensure node on PATH for post-actions (act only)
      shell: bash
      run: |
        set -euo pipefail
        if [ "${ACT:-}" != "true" ]; then
          echo "Not running under act; skipping PATH workaround."
          exit 0
        fi
        n="$(ls -t /opt/acttoolcache/node/*/x64/bin/node 2>/dev/null | head -1 || true)"
        if [ -n "${n}" ] && [ ! -x /usr/local/bin/node ]; then
          ln -sf "${n}" /usr/local/bin/node
          echo "Symlinked ${n} -> /usr/local/bin/node"
        fi
        command -v node >/dev/null
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false
