name: "Bootstrap uv"
description: "Normalize act Node path, setup uv, and sync dependencies"
inputs:
  python-version:
    description: "Python version passed to actions/setup-python"
    required: false
    default: "3.11"
  sync-args:
    description: "Arguments passed to `uv sync`"
    required: false
    default: "--all-groups --python \"${UV_PYTHON:-python}\""
runs:
  using: "composite"
  steps:
    - name: Ensure node on PATH for post-actions (act only)
      if: ${{ env.ACT == 'true' }}
      shell: bash
      run: |
        set -x
        which node || true
        ls -la /opt/acttoolcache/node/*/x64/bin/node 2>/dev/null || true
        n=$(ls -t /opt/acttoolcache/node/*/x64/bin/node 2>/dev/null | head -1 || true)
        echo "Found node: $n"
        if [ -n "$n" ] && [ ! -x /usr/local/bin/node ]; then
          ln -sf "$n" /usr/local/bin/node
          echo "Symlinked $n -> /usr/local/bin/node"
        fi
        which node
        ls -la /usr/local/bin/node || true
    - name: Install uv (act fallback)
      if: ${{ env.ACT == 'true' }}
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      if: ${{ env.ACT != 'true' }}
      with:
        enable-cache: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Sync deps
      shell: bash
      run: |
        eval "uv sync ${{ inputs.sync-args }}"
