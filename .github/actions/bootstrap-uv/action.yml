name: "Bootstrap uv"
description: "Normalize act Node path, setup uv, and sync dependencies"
inputs:
  python-version:
    description: "Python version passed to actions/setup-python"
    required: false
    default: "3.11"
  sync-args:
    description: "Arguments passed to `uv sync`"
    required: false
    # --frozen: install straight from the committed uv.lock without the resolution
    # pass, which would stat every [tool.uv.sources] path — including the editable
    # ../provide-uterm sibling that only exists in the provide.io dev layout.
    #
    # --no-group terminal: --frozen skips RESOLUTION, not INSTALLATION, so a group
    # holding an unbuildable path is still fatal. The terminal session-kind plugin
    # (packages/octowright-terminal) depends on the unpublished provide-uterm, and
    # while it sat in the `dev` group every job died here with
    # "Distribution not found at: .../provide-uterm/packages/provide-uterm" —
    # bootstrap, so lint and tests alike, not just anything terminal-related.
    # Excluding its own group is also the point rather than a workaround: core
    # must build, install and pass with no uterm present anywhere, which is the
    # dependency-layer form of what tests/test_plugin_isolation.py asserts in code.
    #
    # The terminal-plugin job overrides this input to sync the group by name,
    # after ci/clone_provide_uterm.sh puts the sibling checkout in place.
    default: "--frozen --all-groups --no-group terminal --python \"${UV_PYTHON:-python}\""
runs:
  using: "composite"
  steps:
    # Under nektos/act, symlink the bundled node into /usr/local/bin so it
    # stays on PATH for downstream actions. No-op on real GitHub runners.
    - name: Ensure node on PATH for post-actions (act only)
      if: ${{ env.ACT == 'true' }}
      shell: bash
      run: bash "${GITHUB_WORKSPACE}/ci/bootstrap_node_act.sh"
    - name: Install uv (act fallback)
      if: ${{ env.ACT == 'true' }}
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      if: ${{ env.ACT != 'true' }}
      with:
        enable-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Sync deps
      shell: bash
      run: |
        eval "uv sync ${{ inputs.sync-args }}"
