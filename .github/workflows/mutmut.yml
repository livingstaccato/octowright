name: 🧬 Mutation testing (nightly)

on:
  schedule:
    # Daily at 06:00 UTC — runs after typical overnight merges, before EU morning.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_PYTHON_DOWNLOADS: never
  # Install from the committed uv.lock as-is, same as ci.yml. This workflow
  # lacked it, so its bare `uv run` steps re-resolved on the runner; while the
  # lock still pointed at an editable ../provide-uterm sibling, that resolution
  # failed at "Install Playwright browsers" on every nightly from 2026-06-27 to
  # 2026-08-26 (61 runs), and the job-level continue-on-error this workflow
  # used to carry rendered each one as a success. Two months without a single
  # mutation run, and nothing said so.
  UV_FROZEN: "1"
  # Keep scenarios/profiles quiet during CI — never touch $HOME defaults.
  OCTOWRIGHT_RECORDINGS: ${{ github.workspace }}/.ci/recordings
  OCTOWRIGHT_PROFILES_DIR: ${{ github.workspace }}/.ci/profiles
  OCTOWRIGHT_SCENARIOS_DIR: ${{ github.workspace }}/.ci/scenarios
  OCTOWRIGHT_MACROS_DIR: ${{ github.workspace }}/.ci/macros
  OCTOWRIGHT_GOLDENS_DIR: ${{ github.workspace }}/.ci/goldens

jobs:
  mutmut:
    name: 🧬 mutmut
    runs-on: ubuntu-24.04
    # A scheduled run gates nothing: it is not a required check on any PR, so a
    # red result here never blocks main. That is exactly why the job does NOT
    # carry `continue-on-error` — with it, a step that died at bootstrap still
    # rendered as a green job (see the UV_FROZEN note above). Surviving mutants
    # do not turn it red either: `mutmut run` exits 0 after printing its stats
    # and exits 1 only when the CLEAN test run fails. Red means broken, not
    # "some mutants survived".
    # Mutation runs are slow; allow up to 4 hours before GitHub forcibly cancels.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-uv
      # Install Playwright so any mutated paths that try to launch a browser
      # at import time don't crash before mutmut can score them.
      - name: Install Playwright browsers + Linux deps
        run: uv run --active playwright install --with-deps webkit firefox chromium
      # Run mutation testing via the existing Makefile target so config stays
      # in one place (pyproject.toml [tool.mutmut]).
      - name: Run mutmut
        run: make mutmut
      # Render the per-mutant HTML report mutmut 3.x exposes for browsing.
      - name: Generate mutmut HTML report
        if: always()
        run: PYTHONPATH=src uv run --active mutmut html
      # Surface the surviving-mutants count in the workflow summary.
      - name: Mutmut summary (GitHub step summary)
        if: always()
        run: bash ci/mutmut_summary.sh
      # Attach the HTML report + raw mutmut cache for offline inspection.
      - name: Upload mutmut report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-report
          path: |
            html/
            mutants/
          if-no-files-found: warn
