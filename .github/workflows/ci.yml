name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  # Prefer runner Python and avoid uv-managed interpreter bootstrap.
  UV_PYTHON: python3
  UV_PYTHON_DOWNLOADS: never
  # Keep scenarios/profiles quiet during CI — never touch $HOME defaults.
  OCTOWRIGHT_RECORDINGS: ${{ github.workspace }}/.ci/recordings
  OCTOWRIGHT_PROFILES_DIR: ${{ github.workspace }}/.ci/profiles
  OCTOWRIGHT_SCENARIOS_DIR: ${{ github.workspace }}/.ci/scenarios
  OCTOWRIGHT_MACROS_DIR: ${{ github.workspace }}/.ci/macros
  OCTOWRIGHT_GOLDENS_DIR: ${{ github.workspace }}/.ci/goldens

jobs:
  lint:
    name: 🎨 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/bootstrap-uv
      - name: Ruff check
        run: uv run --active ruff check .
      - name: Ruff format check
        run: uv run --active ruff format --check .
      - name: ty check
        run: uv run --active ty check src/octowright
      - name: Bandit
        run: uv run --active bandit -q -r src/octowright -s B101,B110,B112,B324,B404,B405,B602,B603,B607
      - name: SPDX headers
        run: uv run --active python scripts/check_spdx_headers.py

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/bootstrap-uv
      - name: Install Playwright browsers
        run: uv run --active playwright install --with-deps webkit firefox chromium
      - name: Run unit tests (headless, act-safe subset)
        if: ${{ env.ACT == 'true' }}
        env:
          OCTOWRIGHT_HEADLESS: "1"
        run: |
          uv run --active pytest -q tests/ \
            --ignore=tests/test_badge.py \
            --ignore=tests/test_session_mode.py \
            --ignore=tests/test_title_prefix.py \
            --ignore=tests/test_label_promotion.py
      - name: Run unit tests (headless)
        if: ${{ env.ACT != 'true' }}
        env:
          OCTOWRIGHT_HEADLESS: "1"
        run: uv run --active pytest -q tests/
      - name: Selftest — verify tool registration
        run: uv run --active octowright selftest
      - name: Build wheel + sdist
        run: uv run --active python -m build --wheel --sdist
      - name: Verify packaged skill assets in wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile
          whl = glob.glob("dist/*.whl")
          assert whl, "missing wheel artifact"
          required = {
              "octowright/skills/using-octowright/SKILL.md",
              "octowright/skills/using-octowright/skill.json",
              "octowright/skills/manifests/claude-plugin.json",
              "octowright/skills/manifests/codex-plugin.json",
          }
          with zipfile.ZipFile(whl[0]) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          assert not missing, f"wheel missing required files: {missing}"
          PY
      - name: Skill CLI smoke
        env:
          CODEX_HOME: ${{ github.workspace }}/.ci/codex-home
        run: |
          uv run --active octowright skill install using-octowright --target all --dry-run
          uv run --active octowright skill install using-octowright --target all
          uv run --active octowright skill status using-octowright --target all --json
          uv run --active octowright skill doctor --json

  selftest:
    name: 🔧 Selftest — quick smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/bootstrap-uv
        with:
          sync-args: "--python \"$(command -v python3)\""
      - name: Selftest
        run: uv run --active octowright selftest
