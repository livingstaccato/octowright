name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  # Prefer runner Python and avoid uv-managed interpreter bootstrap.
  UV_PYTHON: python3
  UV_PYTHON_DOWNLOADS: never
  # Keep scenarios/profiles quiet during CI — never touch $HOME defaults.
  OCTOWRIGHT_RECORDINGS: ${{ github.workspace }}/.ci/recordings
  OCTOWRIGHT_PROFILES_DIR: ${{ github.workspace }}/.ci/profiles
  OCTOWRIGHT_SCENARIOS_DIR: ${{ github.workspace }}/.ci/scenarios
  OCTOWRIGHT_MACROS_DIR: ${{ github.workspace }}/.ci/macros
  OCTOWRIGHT_GOLDENS_DIR: ${{ github.workspace }}/.ci/goldens

jobs:
  lint:
    name: 🎨 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # act quirk: catthehacker images put node under /opt/acttoolcache but not on
      # the $PATH seen by raw `docker exec` post-action invocations. Symlink it into
      # /usr/local/bin so `docker exec cmd=[node ...]` finds it. No-op on real runners.
      - name: Ensure node on PATH for post-actions (act only)
        run: |
          set -x
          which node || true
          ls -la /opt/acttoolcache/node/*/x64/bin/node 2>/dev/null || true
          n=$(ls -t /opt/acttoolcache/node/*/x64/bin/node 2>/dev/null | head -1)
          echo "Found node: $n"
          if [ -n "$n" ] && [ ! -x /usr/local/bin/node ]; then
            ln -sf "$n" /usr/local/bin/node
            echo "Symlinked $n -> /usr/local/bin/node"
          fi
          which node
          ls -la /usr/local/bin/node || true
      - name: Install uv (act fallback)
        if: ${{ env.ACT == 'true' }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v5
        if: ${{ env.ACT != 'true' }}
        with:
          enable-cache: false
      - name: Sync dev deps
        run: uv sync --all-groups --python "$(command -v python3)"
      - name: Ruff check
        run: uv run --active ruff check .
      - name: Ruff format check
        run: uv run --active ruff format --check --exclude "tests/test_conditional.py,tests/test_pool_framenavigated.py" .
      - name: SPDX headers
        run: uv run --active python scripts/check_spdx_headers.py

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # act quirk: catthehacker images put node under /opt/acttoolcache but not on
      # the $PATH seen by raw `docker exec` post-action invocations. Symlink it into
      # /usr/local/bin so `docker exec cmd=[node ...]` finds it. No-op on real runners.
      - name: Ensure node on PATH for post-actions (act only)
        run: |
          set -x
          which node || true
          ls -la /opt/acttoolcache/node/*/x64/bin/node 2>/dev/null || true
          n=$(ls -t /opt/acttoolcache/node/*/x64/bin/node 2>/dev/null | head -1)
          echo "Found node: $n"
          if [ -n "$n" ] && [ ! -x /usr/local/bin/node ]; then
            ln -sf "$n" /usr/local/bin/node
            echo "Symlinked $n -> /usr/local/bin/node"
          fi
          which node
          ls -la /usr/local/bin/node || true
      - name: Install uv (act fallback)
        if: ${{ env.ACT == 'true' }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v5
        if: ${{ env.ACT != 'true' }}
        with:
          enable-cache: false
      - name: Sync dev deps
        run: uv sync --all-groups --python "$(command -v python3)"
      - name: Install Playwright browsers
        run: uv run --active playwright install --with-deps webkit firefox chromium
      - name: Run unit tests (headless, act-safe subset)
        if: ${{ env.ACT == 'true' }}
        env:
          OCTOWRIGHT_HEADLESS: "1"
        run: |
          uv run --active pytest -q tests/ \
            --ignore=tests/test_badge.py \
            --ignore=tests/test_session_mode.py \
            --ignore=tests/test_title_prefix.py \
            --ignore=tests/test_label_promotion.py
      - name: Run unit tests (headless)
        if: ${{ env.ACT != 'true' }}
        env:
          OCTOWRIGHT_HEADLESS: "1"
        run: uv run --active pytest -q tests/
      - name: Selftest — verify tool registration
        run: uv run --active octowright selftest
      - name: Build wheel + sdist
        run: uv run --active python -m build --wheel --sdist
      - name: Verify packaged skill assets in wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile
          whl = glob.glob("dist/*.whl")
          assert whl, "missing wheel artifact"
          required = {
              "octowright/skills/using-octowright/SKILL.md",
              "octowright/skills/using-octowright/skill.json",
              "octowright/skills/manifests/claude-plugin.json",
              "octowright/skills/manifests/codex-plugin.json",
          }
          with zipfile.ZipFile(whl[0]) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          assert not missing, f"wheel missing required files: {missing}"
          PY
      - name: Skill CLI smoke
        env:
          CODEX_HOME: ${{ github.workspace }}/.ci/codex-home
        run: |
          uv run --active octowright skill install using-octowright --target all --dry-run
          uv run --active octowright skill install using-octowright --target all
          uv run --active octowright skill status using-octowright --target all --json
          uv run --active octowright skill doctor --json

  selftest:
    name: 🔧 Selftest — quick smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # act quirk: catthehacker images put node under /opt/acttoolcache but not on
      # the $PATH seen by raw `docker exec` post-action invocations. Symlink it into
      # /usr/local/bin so `docker exec cmd=[node ...]` finds it. No-op on real runners.
      - name: Ensure node on PATH for post-actions (act only)
        run: |
          set -x
          which node || true
          ls -la /opt/acttoolcache/node/*/x64/bin/node 2>/dev/null || true
          n=$(ls -t /opt/acttoolcache/node/*/x64/bin/node 2>/dev/null | head -1)
          echo "Found node: $n"
          if [ -n "$n" ] && [ ! -x /usr/local/bin/node ]; then
            ln -sf "$n" /usr/local/bin/node
            echo "Symlinked $n -> /usr/local/bin/node"
          fi
          which node
          ls -la /usr/local/bin/node || true
      - name: Install uv (act fallback)
        if: ${{ env.ACT == 'true' }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v5
        if: ${{ env.ACT != 'true' }}
        with:
          enable-cache: false
      - name: Sync
        run: uv sync --python "$(command -v python3)"
      - name: Selftest
        run: uv run --active octowright selftest
