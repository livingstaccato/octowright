name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      os:
        description: "OS target to run"
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - macos
          - windows
      arch:
        description: "CPU architecture target to run"
        type: choice
        required: true
        default: all
        options:
          - all
          - amd64
          - arm64

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_PYTHON_DOWNLOADS: never
  # Keep scenarios/profiles quiet during CI — never touch $HOME defaults.
  OCTOWRIGHT_RECORDINGS: ${{ github.workspace }}/.ci/recordings
  OCTOWRIGHT_PROFILES_DIR: ${{ github.workspace }}/.ci/profiles
  OCTOWRIGHT_SCENARIOS_DIR: ${{ github.workspace }}/.ci/scenarios
  OCTOWRIGHT_MACROS_DIR: ${{ github.workspace }}/.ci/macros
  OCTOWRIGHT_GOLDENS_DIR: ${{ github.workspace }}/.ci/goldens

jobs:
  lint:
    name: 🎨 Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/bootstrap-uv
      - name: Ruff check
        run: uv run --active ruff check .
      - name: Ruff format check
        run: uv run --active ruff format --check .
      # Mirror `make lint` — mypy, codespell, and the LOC gate were
      # previously local-only, which let bigger regressions slip past CI.
      - name: mypy
        run: uv run --active mypy src/octowright
      - name: ty check
        run: uv run --active ty check src/octowright
      - name: Bandit
        run: uv run --active bandit -q -r src/octowright -s B101,B110,B112,B404,B405,B603,B607
      - name: codespell
        run: uv run --active codespell --skip="src/octowright/server/frontend/*,./src/octowright/server/frontend/*"
      - name: SPDX headers
        run: uv run --active python scripts/check_spdx_headers.py
      - name: Max LOC per file (<=500)
        run: uv run --active python scripts/check_max_loc.py
      - name: Agent docs sync
        run: uv run --active python scripts/check_agent_docs_sync.py
      - name: Vulture (dead code)
        run: uv run --active python scripts/check_vulture.py
      - name: Xenon (complexity)
        run: uv run --active python scripts/check_xenon.py
      - name: Secret scan
        run: bash ci/run_detect_secrets.sh
      - name: pip-audit (deps)
        run: uv run --active python scripts/check_pip_audit.py

  frontend:
    name: 🧪 Frontend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/octowright-frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # No lockfile in the workspace — use `npm install` (slightly slower,
      # but reproducible enough for the test job). Switch to `npm ci` once a
      # package-lock.json is committed.
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (vitest with coverage)
        run: npm test

  select-test-matrix:
    name: 🧭 Select test matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      TARGET_OS: ${{ inputs.os || 'all' }}
      TARGET_ARCH: ${{ inputs.arch || 'all' }}
    steps:
      - id: matrix
        name: Build matrix JSON
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          target_os = os.environ.get("TARGET_OS") or "all"
          target_arch = os.environ.get("TARGET_ARCH") or "all"
          targets = [
              {"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04"},
              {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm"},
              {"os": "macos", "arch": "amd64", "runner": "macos-15-intel"},
              {"os": "macos", "arch": "arm64", "runner": "macos-15"},
              {"os": "windows", "arch": "amd64", "runner": "windows-2025"},
              {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"},
          ]
          include = [
              target
              for target in targets
              if target_os in {"all", target["os"]} and target_arch in {"all", target["arch"]}
          ]
          print(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}")
          PY

  test:
    name: 🧪 Tests (${{ matrix.os }} ${{ matrix.arch }})
    needs: select-test-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-test-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/bootstrap-uv
      - name: Install Playwright browsers (act)
        if: ${{ env.ACT == 'true' }}
        run: uv run --active playwright install webkit firefox chromium
      - name: Install Playwright browsers + Linux deps (github)
        if: ${{ env.ACT != 'true' && runner.os == 'Linux' }}
        run: uv run --active playwright install --with-deps webkit firefox chromium
      - name: Install Playwright browsers (github)
        if: ${{ env.ACT != 'true' && runner.os != 'Linux' }}
        run: uv run --active playwright install webkit firefox chromium
      - name: Run unit tests (headless, act-safe subset)
        if: ${{ env.ACT == 'true' }}
        env:
          OCTOWRIGHT_HEADLESS: "1"
        run: |
          uv run --active pytest -q tests/ \
            --no-cov \
            --ignore=tests/test_engine_matrix_live.py \
            --ignore=tests/test_badge.py \
            --ignore=tests/test_pill.py \
            --ignore=tests/test_popup_listeners.py \
            --ignore=tests/test_scenario_sync.py \
            --ignore=tests/test_scenarios_live.py \
            --ignore=tests/test_session_mode.py \
            --ignore=tests/test_title_prefix.py \
            --ignore=tests/test_label_promotion.py
      - name: Run unit tests (headless, Windows verbose)
        if: ${{ env.ACT != 'true' && runner.os == 'Windows' }}
        env:
          OCTOWRIGHT_HEADLESS: "1"
        run: uv run --active pytest -vv tests/ --tb=short -ra --color=no
      - name: Run unit tests (headless)
        if: ${{ env.ACT != 'true' && runner.os != 'Windows' }}
        env:
          OCTOWRIGHT_HEADLESS: "1"
        run: uv run --active pytest -q tests/
      - name: Selftest — verify tool registration
        run: uv run --active octowright selftest
      - name: Build wheel + sdist
        run: uv run --active python -m build --wheel --sdist
      - name: Verify packaged skill assets in wheel
        run: uv run --active python scripts/check_wheel_assets.py
      - name: Skill CLI smoke
        env:
          CODEX_HOME: ${{ github.workspace }}/.ci/codex-home
        run: |
          uv run --active octowright skill install using-octowright --target all --dry-run
          uv run --active octowright skill install using-octowright --target all
          uv run --active octowright skill status using-octowright --target all --json
          uv run --active octowright skill doctor --json

  selftest:
    name: 🔧 Selftest — quick smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/bootstrap-uv
        with:
          sync-args: "--python python"
      - name: Selftest
        run: uv run --active octowright selftest
