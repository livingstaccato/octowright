name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      os:
        description: "OS target to run"
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - macos
          - windows
      arch:
        description: "CPU architecture target to run"
        type: choice
        required: true
        default: all
        options:
          - all
          - amd64
          - arm64

# Supersede an in-flight run when a branch is pushed again: a follow-up
# commit on an open PR otherwise leaves the previous run to finish against
# code nobody will merge. Pushes to main are NOT cancelled — those runs
# gate the release, so the last one must complete on its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_PYTHON_DOWNLOADS: never
  # Use the committed uv.lock as-is for every uv invocation (sync AND run).
  # Precisely what that buys: uv's default is to CHECK the lock against
  # pyproject.toml before each `uv run` / `uv sync` and re-lock only when it is
  # stale — offline and milliseconds when the lock is current, and even a
  # re-lock keeps every existing version and resolves only the delta. --frozen
  # skips that check and installs whatever the lock says, stale or not. So it
  # makes CI deterministic, not fresh: a PR that edits pyproject.toml without
  # re-locking passes every job here against the OLD environment. Nothing in CI
  # runs `uv lock --check`; that is a known gap, left open because the lock
  # format can change between uv releases and setup-uv floats to the latest,
  # so the check would fail on a random day for a reason unrelated to the PR.
  #
  # The flag was added when resolution used to stat an editable ../provide-uterm
  # sibling that existed only in the provide.io dev layout; provide-uterm has
  # been on PyPI since 2026-08-26 and that path source is gone. It never
  # enforced the core-stays-uterm-free boundary: that is the `terminal`
  # dependency group's job (see .github/actions/bootstrap-uv/action.yml), and
  # before the group existed this flag installed uterm from `dev` wherever the
  # sibling happened to be present.
  UV_FROZEN: "1"
  # Keep scenarios/profiles quiet during CI — never touch $HOME defaults.
  OCTOWRIGHT_RECORDINGS: ${{ github.workspace }}/.ci/recordings
  OCTOWRIGHT_PROFILES_DIR: ${{ github.workspace }}/.ci/profiles
  OCTOWRIGHT_SCENARIOS_DIR: ${{ github.workspace }}/.ci/scenarios
  OCTOWRIGHT_MACROS_DIR: ${{ github.workspace }}/.ci/macros
  OCTOWRIGHT_GOLDENS_DIR: ${{ github.workspace }}/.ci/goldens

jobs:
  lint:
    name: 🎨 Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-uv
      - name: Ruff check
        run: uv run --active ruff check .
      - name: Ruff format check
        run: uv run --active ruff format --check .
      # Mirror `make lint` — mypy, codespell, and the LOC gate were
      # previously local-only, which let bigger regressions slip past CI.
      - name: mypy
        run: uv run --active mypy src/octowright packages/octowright-terminal/src tests/plugins/reference
      - name: ty check
        run: uv run --active ty check src/octowright
      - name: Bandit
        run: uv run --active bandit -q -r src/octowright -s B101,B110,B112,B404,B405
      - name: codespell
        # packages/octowright-terminal/.../assets/renderer.js is a committed,
        # minified build artifact (see packages/octowright-terminal/assets-src/) --
        # same reason core's built frontend is excluded above. Keep this in
        # sync with the Makefile's `lint` target.
        run: uv run --active codespell --skip="src/octowright/server/frontend/*,./src/octowright/server/frontend/*,packages/octowright-terminal/src/octowright_terminal/assets/*,./packages/octowright-terminal/src/octowright_terminal/assets/*"
      - name: SPDX headers
        run: uv run --active python scripts/check_spdx_headers.py
      - name: Max LOC per file (<=777)
        run: uv run --active python scripts/check_max_loc.py
      - name: Agent docs sync
        run: uv run --active python scripts/check_agent_docs_sync.py
      # Catch plugin-manifest version drift server-side: the same check runs as a
      # pre-commit hook, but that only fires on local commits — this enforces it
      # on every push/PR so a stale .claude/.codex/.antigravity plugin.json fails CI.
      - name: Plugin manifest versions match VERSION
        run: uv run --active python scripts/check_plugin_versions.py
      - name: Vulture (dead code)
        run: uv run --active python scripts/check_vulture.py
      - name: Xenon (complexity)
        run: uv run --active python scripts/check_xenon.py
      - name: Secret scan
        run: bash ci/run_detect_secrets.sh
      # Audits the core-only environment (`--no-group terminal`). The terminal
      # group's own dependency tree is audited by the terminal-plugin job, the
      # one leg that installs it.
      - name: pip-audit (deps)
        run: uv run --active python scripts/check_pip_audit.py

  frontend:
    name: 🧪 Frontend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # Reproducible install from the committed root package-lock.json. The
      # frontend is an npm workspace, so npm ci + the scripts run from the repo
      # root and target the package via --workspace.
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (fail on high)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck --workspace=packages/octowright-frontend
      - name: Lint
        run: npm run lint --workspace=packages/octowright-frontend
      - name: Tests (vitest with coverage)
        run: npm test --workspace=packages/octowright-frontend
      # The terminal plugin's dashboard renderer is a COMMITTED build artifact:
      # a Python wheel has no npm step at install time and the dashboard serves
      # plugin assets verbatim off disk, so the bundle has to be in the
      # distribution. The cost is that editing assets-src/src/renderer.ts and
      # forgetting to rebuild ships a stale renderer with no signal at all. This
      # rebuilds it and fails if the committed file differs. Note the script
      # installs INSIDE packages/octowright-terminal/assets-src, which has its own
      # package-lock.json and is deliberately not a root npm workspace member —
      # that separation is what keeps xterm out of core's own bundle, so the two
      # dependency trees must stay apart rather than be merged for convenience.
      - name: Terminal plugin renderer matches its source
        run: bash ci/check_terminal_renderer.sh

  select-test-matrix:
    name: 🧭 Select test matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      TARGET_OS: ${{ inputs.os || 'all' }}
      TARGET_ARCH: ${{ inputs.arch || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        # Filter the canonical runner list against the workflow_dispatch inputs.
        name: Build matrix JSON
        run: python ci/build_test_matrix.py >> "$GITHUB_OUTPUT"

  test:
    name: 🧪 Tests (${{ matrix.os }} ${{ matrix.arch }})
    needs: select-test-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-test-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-uv
      # Linux needs --with-deps: the downloaded browsers link against system
      # libraries (libgbm.so.1 and friends) that neither a GitHub runner nor an
      # act container ships. This applies under act too — act runs the same
      # ubuntu image, as root, so the apt step works there as well. Splitting
      # act onto a deps-less install produced browsers that installed fine and
      # then died on launch with "error while loading shared libraries", which
      # surfaced ~200 lines later as an unrelated-looking "Target page, context
      # or browser has been closed".
      - name: Install Playwright browsers + Linux deps
        if: ${{ runner.os == 'Linux' }}
        run: uv run --active playwright install --with-deps webkit firefox chromium
      - name: Install Playwright browsers
        if: ${{ runner.os != 'Linux' }}
        run: uv run --active playwright install webkit firefox chromium
      # Under act, skip tests that need real-display/popup/live-engine support.
      - name: Run unit tests (headless, act-safe subset)
        if: ${{ env.ACT == 'true' }}
        env:
          OCTOWRIGHT_HEADLESS: "1"
        run: bash ci/run_unit_tests.sh
      # Two-phase pytest: integration_local writes junitxml (artifact),
      # then the main suite runs. Script keeps the logic out of YAML so the
      # bash line continuations survive Windows' default-PowerShell parser.
      - name: Run unit tests (headless, Windows verbose)
        if: ${{ env.ACT != 'true' && runner.os == 'Windows' }}
        shell: bash
        env:
          OCTOWRIGHT_HEADLESS: "1"
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ matrix.arch }}
          VERBOSE: "1"
        run: bash ci/run_integration_and_main.sh
      - name: Run unit tests (headless)
        if: ${{ env.ACT != 'true' && runner.os != 'Windows' }}
        env:
          OCTOWRIGHT_HEADLESS: "1"
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ matrix.arch }}
        run: bash ci/run_integration_and_main.sh
      - name: Upload integration-local media + reports
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-local-${{ runner.os }}-${{ matrix.arch }}
          path: |
            .ci/integration-local-*.xml
            .ci/recordings/
            demo/bundles/role-based-duo/artifacts/
            demo/bundles/seven-mix-orchestration/artifacts/
          if-no-files-found: warn
      # Coverage gate (Linux only): re-runs `coverage report` so the
      # --cov-fail-under threshold in pyproject.toml becomes a dedicated
      # failing step instead of a buried tail of pytest output.
      - name: Coverage gate (--cov-fail-under)
        if: ${{ env.ACT != 'true' && runner.os == 'Linux' }}
        run: uv run --active coverage report
      # Generate machine-readable + browsable coverage artifacts for review.
      - name: Coverage XML + HTML reports
        if: ${{ env.ACT != 'true' && runner.os == 'Linux' }}
        run: |
          uv run --active coverage xml -o coverage.xml
          uv run --active coverage html -d htmlcov
      # Publish a coverage totals + per-file table to the workflow summary.
      - name: Coverage summary (GitHub step summary)
        if: ${{ env.ACT != 'true' && runner.os == 'Linux' }}
        run: bash ci/coverage_summary.sh
      # Attach the XML + HTML report so PR reviewers can download it.
      - name: Upload coverage report artifact
        if: ${{ env.ACT != 'true' && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
      - name: Selftest — verify tool registration
        run: uv run --active octowright selftest
      # The built SPA at src/octowright/server/frontend/ is gitignored —
      # build it before the wheel so check_wheel_assets.py finds the
      # dashboard HTML/JS/CSS.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Build frontend SPA
        run: npm ci && npm run build --workspace=packages/octowright-frontend
      - name: Build wheel + sdist
        run: uv run --active python -m build --wheel --sdist
      - name: Verify packaged assets in wheel
        run: uv run --active python scripts/check_wheel_assets.py
      # Exercise the `octowright skill` CLI surface end-to-end against a
      # sandboxed CODEX_HOME inside the workspace.
      - name: Skill CLI smoke
        env:
          CODEX_HOME: ${{ github.workspace }}/.ci/codex-home
        run: bash ci/smoke_skill.sh

  # The terminal session-kind plugin (packages/octowright-terminal) is a separate
  # distribution and core's `pytest tests/` legs never reach its suite, so it
  # gets its own job.
  #
  # That suite had NEVER run in CI. Under the old octowright[terminal] extra it
  # self-ignored at collection because uterm was never installed, and a skip that
  # renders as a pass is exactly how three real failures sat unnoticed until the
  # extraction forced someone to install uterm locally. It runs for real here:
  # ci/run_terminal_plugin_tests.sh asserts uterm is importable BEFORE pytest, so
  # an absent dependency fails loudly instead of passing over zero tests.
  #
  # provide-uterm is on PyPI as of 2026-08-26, so this job no longer clones the
  # sibling repo at a pinned commit -- the `terminal` dependency group resolves
  # it like any other dependency.
  #
  # Because it is the only leg with uterm installed, it also carries the two
  # checks that mean nothing without it: mypy over the plugin (the lint job's
  # mypy sees every uterm symbol as `Any`) and pip-audit over the group's
  # dependency tree (the lint job's audit never sees those packages).
  terminal-plugin:
    name: 🖥️ Terminal plugin tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The one job that DOES sync the `terminal` dependency group — every other
      # job excludes it (see .github/actions/bootstrap-uv/action.yml) so core's
      # legs prove they install and pass with no uterm present at all.
      - uses: ./.github/actions/bootstrap-uv
        with:
          sync-args: '--frozen --all-groups --python "${UV_PYTHON:-python}"'
      # mypy with provide-uterm actually present. The lint job runs mypy over
      # this same package, but under `--no-group terminal`, where the
      # provide.uterm.* override in pyproject.toml makes every uterm symbol
      # `Any` -- so a type error at the uterm boundary (engine.py, redact.py,
      # availability.py) passed there by construction. This is the only leg
      # where "ships py.typed, so it types cleanly" is checked, not assumed.
      - name: mypy (plugin, with provide-uterm present)
        run: uv run --active mypy packages/octowright-terminal/src
      # pip-audit over the one environment that contains the terminal group's
      # dependency tree: asyncssh, aiosqlite, provide-uterm and its siblings.
      # The lint job's audit runs under `--no-group terminal`, so none of those
      # were ever scanned -- while uv.lock ships them to every `make install`.
      - name: pip-audit (deps incl. terminal group)
        run: uv run --active python scripts/check_pip_audit.py
      # The plugin's own suite, plus an end-to-end check that the entry point
      # reaches the real tool surface: OCTOWRIGHT_PLUGINS=terminal must add
      # exactly 7 terminal_* tools, and an unset value must add none.
      - name: Terminal plugin suite + tool-surface check
        run: bash ci/run_terminal_plugin_tests.sh
