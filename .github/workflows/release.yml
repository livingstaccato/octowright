name: 🚀 Release

# Publish to PyPI (full releases) or TestPyPI (pre-releases) when a GitHub
# Release is published, via OIDC Trusted Publishing (no API token / secret).
# One-time setup: on pypi.org, project octowright -> Publishing -> add a
# trusted publisher with repo livingstaccato/octowright, workflow release.yml,
# environment pypi. Same on test.pypi.org with environment testpypi.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: 📦 Build distributions
    runs-on: ubuntu-latest
    steps:
      # Check out the tag the release points at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The dashboard SPA is gitignored, so build it before packaging or the
      # wheel ships a server with no UI (check_wheel_assets.py enforces this).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Build frontend SPA
        run: npm ci && npm run build --workspace=packages/octowright-frontend

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Build wheel + sdist with the PEP 517 backend (hatchling), via pipx so
      # this job needs no project venv at all. Run at the repo root this builds
      # ONLY octowright: packages/octowright-terminal is a separate distribution
      # that nothing in this workflow builds or publishes -- which is why the
      # terminal plugin is not on PyPI and is installed from the checkout.
      - name: Build distributions
        run: pipx run build --wheel --sdist

      # Fail the release if the wheel/sdist is missing the bundled dashboard.
      - name: Verify packaged assets
        run: python scripts/check_wheel_assets.py

      # Hand the built dist/ off to whichever publish job runs below — each
      # publish job needs its own OIDC-scoped environment, so they can't just
      # keep building inline as one job the way the old single-job release did.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: 🧪 Publish to TestPyPI
    needs: build
    if: github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # OIDC token for TestPyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Upload to TestPyPI over OIDC — no token. Requires the testpypi trusted
      # publisher configured on test.pypi.org (see the header comment).
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: 📦 Publish to PyPI
    needs: build
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Upload to PyPI over OIDC — no token. Requires the pypi trusted
      # publisher configured on pypi.org (see the header comment).
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
