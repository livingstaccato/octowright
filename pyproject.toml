[project]
name = "octowright"
version = "0.1.0"
description = "MCP server that drives multiple headed Playwright browsers (chromium/firefox/webkit) in parallel with per-instance action recording."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tim", email = "tim@neurotic.org" }]
dependencies = [
    "mcp>=1.2.0",
    "playwright>=1.47.0",
    "anyio>=4.4.0",
    "provide-telemetry>=0.3",
    "click>=8.1",
]

[project.scripts]
octowright = "octowright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octowright"]

[tool.ruff]
line-length = 120
target-version = "py312"
