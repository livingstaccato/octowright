[project]
name = "octowright"
version = "0.1.0"
description = "MCP server that drives multiple headed Playwright browsers (chromium/firefox/webkit) in parallel with per-instance action recording and persistent profiles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tim", email = "tim@neurotic.org" }]
dependencies = [
    "mcp>=1.2.0",
    "playwright>=1.47.0",
    "anyio>=4.4.0",
    "provide-telemetry>=0.3",
    "click>=8.1",
]

[project.scripts]
octowright = "octowright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octowright"]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio[trio]>=4.4.0",
    "pytest-anyio>=0.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
