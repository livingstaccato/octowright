[project]
name = "octowright"
version = "0.1.0"
description = "MCP server that drives multiple headed Playwright browsers (chromium/firefox/webkit) in parallel with per-instance action recording and persistent profiles."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSES/*"]
authors = [{ name = "Tim", email = "tim@neurotic.org" }]
dependencies = [
    "mcp>=1.2.0",
    "playwright>=1.47.0",
    "anyio>=4.4.0",
    "provide-telemetry>=0.3",
    "click>=8.1",
    "pyyaml>=6",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
octowright = "octowright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octowright"]

[dependency-groups]
# Mirrors provide-telemetry's dev toolchain so any contributor across the
# provide-io ecosystem runs the same checks. Bump in lockstep with that project.
dev = [
    "anyio[trio]>=4.4.0",
    "bandit>=1.8.6",
    "build>=1.2.2",
    "codespell>=2.4.1",
    "hypothesis>=6.130.0",
    "memray>=1.0; sys_platform == 'linux' or sys_platform == 'darwin'",
    "mutmut>=3.3.1",
    "mypy>=1.18.0",
    "pip-audit>=2.7.0",
    "pip-licenses>=5.0.0",
    "pre-commit>=4.6.0",
    "pytest>=8.3.0",
    "pytest-anyio>=0.0.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.1.1",
    "pytest-randomly>=3.15.0",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.8.0",
    "reuse>=6.2.0",
    "ruff>=0.14.5",
    "twine>=5.1.1",
    "ty>=0.0.18",
    "vulture>=2.14",
    "xenon>=0.9.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=src/octowright",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src/octowright"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# fail_under will be raised as we backfill tests; set deliberately low for now.
fail_under = 50

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["recordings", "profiles", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RUF"]
ignore = [
    "E501",   # line-too-long — rely on line-length above
    "SIM105", # contextlib.suppress vs try/except pass — stylistic
    "B008",   # function-call-in-default-argument — Playwright handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "RUF012", "B017"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mcp.*", "provide.telemetry.*", "yaml"]
ignore_missing_imports = true

[tool.codespell]
skip = ".git,*.pyc,__pycache__,.venv,recordings,profiles,uv.lock"
ignore-words-list = "nd,strat"
