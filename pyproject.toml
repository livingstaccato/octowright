[project]
name = "octowright"
dynamic = ["version"]
description = "MCP server that drives multiple headed Playwright browsers (chromium/firefox/webkit) in parallel with per-instance action recording and persistent profiles."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSES/*"]
authors = [
    { name = "Tim Perkins", email = "code@tim.life" },
    { name = "provide.io", email = "code@provide.io" },
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "playwright",
    "browser-automation",
    "agent",
    "claude",
    "testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "defusedxml>=0.7.1",
    # One HTTP client, deliberately. The tree briefly carried both httpx 0.x and
    # httpx2 (the MCP 2.0 SDK requires the 2.x client), and the cost was not
    # theoretical: both log an INFO "HTTP Request: ..." line under SEPARATE
    # logger names, so silencing one left `octowright doctor --json` one import
    # away from emitting unparsable output. server/web.py was the last holdout
    # -- it subclasses AsyncHTTPTransport for DNS pinning and reads the private
    # _config -- and httpx2/httpcore2 expose both with identical shapes.
    "httpx2>=2.5.0",
    "mcp>=2.0.0",
    "playwright>=1.47.0",
    "anyio>=4.4.0",
    "provide-telemetry[otel]>=0.4.8",
    "click>=8.1",
    # Security floor: cryptography >=50.0.0 fixes PYSEC-2026-3552 (and the older
    # GHSA-537c-gmf6-5ccf) everywhere a wheel exists (Linux, macOS, win-amd64).
    "cryptography>=50.0.0; sys_platform != 'win32' or (platform_machine != 'ARM64' and platform_machine != 'arm64' and platform_machine != 'aarch64')",
    # Windows ARM64 has no cryptography wheel after 46.0.3 and the runner can't
    # build from source, so it stays on the newest installable release. The
    # pip-audit gate runs on Linux (patched 50.x), so this exception doesn't
    # weaken it; revisit when upstream resumes win_arm64 wheel coverage.
    "cryptography>=46.0.3,<46.0.4; sys_platform == 'win32' and (platform_machine == 'ARM64' or platform_machine == 'arm64' or platform_machine == 'aarch64')",
    "pyyaml>=6",
    # starlette >=1.3.1 fixes CVE-2026-54282 / CVE-2026-54283.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    # Security floors — patched versions of otherwise-transitive deps flagged by
    # pip-audit (CVE remediation): python-multipart CVE-2026-53538/39/40,
    # msgpack GHSA-6v7p-g79w-8964, pydantic-settings GHSA-4xgf-cpjx-pc3j.
    "python-multipart>=0.0.31",
    "msgpack>=1.2.1",
    "pydantic-settings>=2.14.2",
]

# No [project.optional-dependencies] here: terminal sessions used to be an
# `octowright[terminal]` extra, but step 5 (see AGENTS.md "Terminal Sessions
# (plugin)") moved them out to the packages/octowright-terminal workspace
# member entirely -- core has no code left that would use provide-uterm, so
# an extra installing it into *this* distribution would have nothing to do.
# Install the terminal plugin as its own package instead: it is on PyPI as of
# core 0.19.2 (`pip install octowright-terminal`), and a source checkout uses
# the `terminal` dependency group; see packages/octowright-terminal/README.md.

[project.urls]
Homepage = "https://github.com/livingstaccato/octowright"
Documentation = "https://foundry.provide.io/octowright/"
Repository = "https://github.com/livingstaccato/octowright"
Issues = "https://github.com/livingstaccato/octowright/issues"

[project.scripts]
octowright = "octowright.cli:main"

[build-system]
# hatchling>=1.32.0 emits Metadata-Version 2.5, which pypa/gh-action-pypi-publish
# v1.14.0's bundled validator rejects outright ("InvalidDistribution: '2.5' is
# not a valid metadata version") -- confirmed by building locally with 1.31.0
# (Metadata-Version 2.4, accepted) vs 1.32.0 (2.5, rejected). Upper-bound until
# the publish tooling catches up to the newer metadata spec; safe to lift once
# a release note there confirms 2.5 support.
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

# Single source of truth for the version is the top-level VERSION file, matching
# the rest of the provide-io ecosystem (see e.g. provide-telemetry/VERSION).
[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = "^(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/octowright"]
# Skills package data must be explicit because hatch's default file selection
# on src-layout wheels only includes .py files. Without these, the wheel ships
# without the skill manifests + assets.
artifacts = [
    "src/octowright/skills/**/*.json",
    "src/octowright/skills/**/*.md",
    "src/octowright/browser_pool/_assets/*.js",
    # Built SPA assets served by http/frontend.py. Without these the wheel
    # ships a dashboard server with no UI to serve. Regenerate from
    # packages/octowright-frontend/ via ``npm run build``.
    "src/octowright/server/frontend/*.html",
    "src/octowright/server/frontend/*.css",
    "src/octowright/server/frontend/*.js",
    "src/octowright/server/frontend/*.js.map",
    "src/octowright/server/frontend/*.svg",
    "src/octowright/http/*.svg",
]

[tool.hatch.build.targets.sdist]
# Explicit include list: VCS-tracked sources, tests, docs, examples, and the
# repo-root files needed to build from sdist. A prior bug used
# `include = ["src/octowright/skills/**"]`, which truncated sdists to just the
# skills tree and produced a 22 KB wheel with no source code — kept explicit
# here so any future narrowing is visible in review.
#
# tools/octowright_demos and demo/bundles are required by the test suite
# (tests import octowright_demos and reference demo/bundles/*) but live
# outside src/ so they never reach the wheel. Shipping them in the sdist keeps
# `pip install <sdist>` + `pytest` working for downstream packagers.
include = [
    "src/**",
    "tests/**",
    "docs/**",
    "examples/**",
    "tools/octowright_demos/**",
    "demo/bundles/**",
    "README.md",
    "LICENSES/**",
    "REUSE.toml",
    "Makefile",
    "pyproject.toml",
]
# `artifacts` picks up gitignored built assets (the SPA bundle) that `include`
# would otherwise skip because they aren't tracked by VCS.
artifacts = [
    "src/octowright/server/frontend/*.html",
    "src/octowright/server/frontend/*.css",
    "src/octowright/server/frontend/*.js",
    "src/octowright/server/frontend/*.js.map",
    "src/octowright/server/frontend/*.svg",
]

[tool.uv.workspace]
# The session-kind terminal plugin (see AGENTS.md "Terminal Sessions") lives as
# its own workspace member so it can declare its own dependencies (uterm +
# asyncssh) independently of core, and reach core only through the
# octowright.session_kinds entry point. packages/octowright-frontend is not a
# Python member and is intentionally not listed here.
members = ["packages/octowright-terminal"]

[tool.uv.sources]
# The provide-uterm ecosystem is on PyPI as of 2026-08-26, so the four local
# `../provide-uterm/packages/*` path overrides that used to live here are gone:
# packages/octowright-terminal resolves its uterm dependencies normally, and a
# source checkout no longer needs the sibling repo beside it.
#
# The terminal plugin workspace member (see [tool.uv.workspace] above), and the
# workspace root itself -- uv requires an explicit self-source once any member
# depends back on the root project by name.
octowright-terminal = { workspace = true }
octowright = { workspace = true }

[dependency-groups]
# Mirrors provide-telemetry's dev toolchain so any contributor across the
# provide-io ecosystem runs the same checks. Bump in lockstep with that project.
dev = [
    "anyio[trio]>=4.4.0",
    "bandit>=1.8.6",
    "build>=1.2.2",
    "codespell>=2.4.1",
    "detect-secrets>=1.5.0",
    "hypothesis>=6.130.0",
    "memray>=1.19.3; sys_platform == 'linux' or sys_platform == 'darwin'",
    "mutmut>=3.3.1",
    "mypy>=1.18.0",
    "pip-audit>=2.7.0",
    "pip-licenses>=5.0.0",
    "pre-commit>=4.6.0",
    "pytest>=8.3.0",
    "pytest-anyio>=0.0.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.1.1",
    "pytest-randomly>=3.15.0",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.8.0",
    "reuse>=6.2.0",
    "ruff>=0.15.0",
    "twine>=5.1.1",
    "ty>=0.0.18",
    "vulture>=2.14",
    "xenon>=0.9.3",
]

# The session-kind terminal plugin (packages/octowright-terminal), a workspace
# member, in its OWN group -- deliberately not part of `dev`. The full story
# (why it was carved out, and why it stays carved out now that provide-uterm is
# on PyPI) lives in ONE place, .github/actions/bootstrap-uv/action.yml, beside
# the `--no-group terminal` that is the other half of the same decision; keep it
# there rather than growing a second copy here. What is specific to this side:
# a dependency group is the only place that boundary can be enforced at the
# dependency layer (tests/test_plugin_isolation.py enforces it in code), and
# `make install` (uv sync --all-groups) includes the group, which is what a dev
# working on the plugin wants -- while a plain `uv sync` afterwards uninstalls
# it again, since a sync is exact.
terminal = [
    "octowright-terminal",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# No single test may hang the run. Nothing bounded a wedged test before this,
# and the failure mode is not theoretical: a WebKit target that stops answering
# takes the whole suite with it, because `page.on("crash")` never fires for a
# target that is merely unresponsive and pytest waits forever by default. A
# local `make test` was observed sitting on ONE live-browser test past the
# 12.6-hour mark on 2026-08-29 -- with no test name in the output, since the
# nodeid is only printed once a test FINISHES at the default verbosity.
#
# 300s is chosen against measurement, not taste: the slowest legitimate test
# observed locally is a two-participant headless WebKit scenario at 81s, and a
# whole CI leg finishes in ~10.5 minutes, so no single test comes close to this
# on any runner. Raising it would weaken the bound; lowering it would start
# failing real tests on a loaded machine.
#
# `thread` is chosen over the default, and the default does NOT work here --
# measured, not assumed. With `signal` (the default wherever SIGALRM exists),
# the plugin arms ONE alarm across the whole runtest protocol and cancels it at
# the end, so the alarm is spent the moment it fires. On the reproducer above
# it fired in the call phase, failed the test as designed -- and then teardown
# wedged with no alarm left to arm, leaving the process alive and silent 6+
# minutes later. A bound that a second wedge walks straight through is not a
# bound. `thread` uses a `threading.Timer` that dumps every thread's stack and
# calls `os._exit(1)`, which nothing in the test can outlast.
#
# The cost is real and worth stating: the run dies at the first wedge instead
# of continuing, so results after it are lost. That is still strictly better
# than today, where a wedge produces no test name, no stacks, and no results at
# all until someone notices hours later and kills it by hand.
timeout = 300
timeout_method = "thread"
# pytest's own default list, plus `mutants`. mutmut copies the whole project --
# `conftest.py` included -- into `mutants/` and leaves it there, and pytest then
# walks it as an ordinary directory: a bare `pytest` at the repo root dies in
# collection with `ImportPathMismatchError` on the duplicated `tests.conftest`,
# and under `-p no:randomly` with "option names {'--randomly-seed'} already
# added", because both copies of the root conftest register the stand-in that
# exists so mutmut can run at all. Running `make mutmut` once therefore made a
# bare `pytest` unusable until the directory was deleted by hand. `make test`
# passes `tests/` explicitly and never noticed.
#
# This setting REPLACES the built-in list rather than extending it, so the
# defaults are restated here; dropping one would quietly start collecting
# `build/`, `dist/` or `node_modules/`.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "mutants"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=src/octowright",
    "--cov-branch",
    "--cov-report=term-missing",
    # pytest-randomly reshuffles collection order on every run from a
    # time-derived seed. That is how an order-dependent failure gets found, and
    # also how it becomes impossible to act on: a wedge or a flake lands on a
    # different test each run, so "exclude the failing test and see" reports a
    # NEW victim every time and reads as an inter-test leak that isn't there.
    # An hour was spent on exactly that misreading. Pinning the seed makes a run
    # reproducible by default; the shuffling is one flag away when it is the
    # point -- `--randomly-seed=last` to replay the previous run, an explicit
    # integer to replay a specific one, or `--randomly-dont-reorganize` for
    # source order. NOT `-p no:randomly`: unloading the plugin also unregisters
    # the option this line passes, so pytest exits 4 with "unrecognized
    # arguments: --randomly-seed". Use the plugin's own flag, which leaves the
    # option parseable. Bump this constant to re-roll the order for everyone.
    "--randomly-seed=20260830",
]
markers = [
    "live_browser: tests that require real browser engines installed",
    "engine_matrix: tests that exercise chromium/firefox/webkit matrices",
    "integration_local: tests that run against the local demo playground server",
    "terminal: optional terminal-session tests; require provide-uterm (the octowright-terminal plugin's own dependency, resolved from PyPI via the `terminal` dependency group -- which a plain `uv sync` and core's CI legs exclude, and `make install` / `uv sync --all-groups` / `--group terminal` include). Auto-applied to everything under packages/octowright-terminal/tests/. Select with -m terminal / exclude with -m 'not terminal'.",
    "memory_isolated: tests whose assertion is a process-wide tracemalloc heap diff, so they must run in their own pytest process rather than interleaved with the rest of the suite (thousands of unrelated tests' retained state otherwise pollutes the measurement window). Run alone in CI; excluded from the main suite invocation.",
]
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated;.*:DeprecationWarning:websockets\\.legacy",
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning:uvicorn\\.protocols\\.websockets\\.websockets_impl",
]

[tool.coverage.run]
source = ["src/octowright"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Raised as part of pre-release hardening.
fail_under = 83

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["recordings", "profiles", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RUF", "TID"]
ignore = [
    "E501",   # line-too-long — rely on line-length above
    "SIM105", # contextlib.suppress vs try/except pass — stylistic
    "B008",   # function-call-in-default-argument — Playwright handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "RUF012", "B017"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
# provide.uterm.* backs the terminal session-kind plugin
# (packages/octowright-terminal, imported unconditionally by its own source
# under packages/octowright-terminal/src/octowright_terminal/). It ships
# py.typed. Core's own CI legs sync `--no-group terminal` on purpose (see that
# group above), so the package is genuinely absent when the lint job's mypy
# runs, and ignore_missing_imports keeps that run green -- at the cost of typing
# every uterm symbol as Any there. The terminal-plugin job in ci.yml runs mypy
# over the plugin with the package present, which is the only place a type
# error at the uterm boundary can actually be caught. Core itself
# (src/octowright) never imports provide.uterm at all -- see
# tests/test_plugin_isolation.py -- so this override exists purely for the
# plugin package half of `mypy src/octowright packages/octowright-terminal/src`.
module = ["mcp.*", "provide.telemetry.*", "provide.uterm.*", "yaml"]
ignore_missing_imports = true

[tool.codespell]
# mutants/ is the gitignored mutmut workdir (a full copy of src/ + built
# frontend assets); scanning it fails lint for anyone who ran `make mutmut`.
skip = ".git,*.pyc,__pycache__,.venv,recordings,profiles,uv.lock,node_modules,mutants,packages/*/coverage,packages/*/dist,package-lock.json"
# JS variable shorthands that codespell mistakes for typos:
# `optionel` = HTML <option> elements; `ths` = HTML <th> elements (table headers)
ignore-words-list = "nd,strat,optionel,ths"

# Mutation testing — opt-in via `make mutmut`. Scoped to parsing / dispatch
# modules where weak assertions matter most. mutmut 3.x reads ALL config
# from this block; CLI flags for paths/runner are no longer accepted.
[tool.mutmut]
source_paths = [
    "src/octowright/personas.py",
    "src/octowright/scenarios.py",
    "src/octowright/macros/",
    # The artifact store's shared layer. Added 2026-08-27 after a verification
    # idempotency bug lived here undetected: `macros/artifacts.py` was mutated
    # while the module it delegates every check evaluation to was not, so the
    # defect sat in the one file mutation testing could not see.
    "src/octowright/artifacts/",
]
# Only run the tests that exercise the mutated paths. mutmut 3.x's mutants/
# workdir doesn't navigate the full repo cleanly (demo bundles, scripts/demos,
# etc.), so we point it at the targeted unit suites only.
pytest_add_cli_args_test_selection = [
    "tests/artifacts_paths/test_run_id_containment.py",
    "tests/field_diagnostics/test_macro_failure_console.py",
    "tests/macro_lint/test_credential_thresholds.py",
    "tests/macro_lint/test_cli_export_coverage.py",
    "tests/macro_lint/test_cli_export_execution.py",
    "tests/macro_lint/test_cli_export_semantic.py",
    "tests/macro_lint/test_derivation_matches_replay.py",
    "tests/macro_lint/test_fields_edges.py",
    "tests/macro_lint/test_finder_keys.py",
    "tests/macro_lint/test_lint_noise_floor.py",
    "tests/macro_lint/test_locator_arity.py",
    "tests/macro_lint/test_token_like_boundaries.py",
    "tests/macro_lint/test_token_shapes_regression.py",
    "tests/macro_lint/test_unknown_fields.py",
    "tests/macro_lint/test_url_credential_parts.py",
    "tests/macro_lint/test_url_credentials.py",
    "tests/macro_lint/test_urls_edges.py",
