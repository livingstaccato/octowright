[project]
name = "octowright"
version = "0.1.0"
description = "MCP server that drives multiple headed Playwright browsers (chromium/firefox/webkit) in parallel with per-instance action recording and persistent profiles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tim", email = "tim@neurotic.org" }]
dependencies = [
    "mcp>=1.2.0",
    "playwright>=1.47.0",
    "anyio>=4.4.0",
    "provide-telemetry>=0.3",
    "click>=8.1",
    "pyyaml>=6",
]

[project.scripts]
octowright = "octowright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octowright"]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio[trio]>=4.4.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.8",
    "mypy>=1.11",
    "codespell>=2.3",
    "pre-commit>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["recordings", "profiles", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RUF"]
ignore = [
    "E501",   # line-too-long — rely on line-length above
    "SIM105", # contextlib.suppress vs try/except pass — stylistic
    "B008",   # function-call-in-default-argument — Playwright handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "RUF012", "B017"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mcp.*", "provide.telemetry.*", "yaml"]
ignore_missing_imports = true

[tool.codespell]
skip = ".git,*.pyc,__pycache__,.venv,recordings,profiles,uv.lock"
ignore-words-list = "nd,strat"
