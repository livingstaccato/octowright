name: cross-engine
description: |
  One instance per engine — Chromium, Firefox, WebKit — each running the
  same Wikipedia search in parallel. The point: three real browsers, same
  real site, same task. Timing differences are real; result differences (if
  any) are real. Replaces the previous offline showroom because synthetic
  HTML undersold the "watch three real browsers" pitch.
participants:
  - persona: cx-chromium
    kind: chromium
    role: player
    url: https://en.wikipedia.org/
  - persona: cx-firefox
    kind: firefox
    role: player
    url: https://en.wikipedia.org/
  - persona: cx-webkit
    kind: webkit
    role: player
    url: https://en.wikipedia.org/
verify:
  player: "wikipedia-search"
