name: duo
description: |
  Two browsers, different roles, shared state. The player drives a three-
  step form on the playground; the monitor watches a dashboard table fill
  with the step events in real time via SSE. Demonstrates per-role macros:
  the player runs form-flow-fill, the monitor runs dashboard-watch.

  Run via: uv run python scripts/demos/with_playground.py role-based-duo
participants:
  - persona: duo-player
    kind: chromium
    role: player
    url: "http://127.0.0.1:7900/form-flow.html"
  - persona: duo-monitor
    kind: chromium
    role: monitor
    url: "http://127.0.0.1:7900/dashboard.html"
verify:
  player: "form-flow-fill"
  monitor: "dashboard-watch"
