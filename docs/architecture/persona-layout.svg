"entity" data-qualified-name="ROOT.TIM.TW" data-source-line="30" id="ent0010"><path d="M1219.4,217.2683 L1260.4,217.2683 A3.75,3.75 0 0 1 1262.9,219.7683 L1269.9,238.2683 L1296.6061,238.2683 A2.5,2.5 0 0 1 1299.1061,240.7683 L1299.1061,269.2566 A2.5,2.5 0 0 1 1296.6061,271.7566 L1219.4,271.7566 A2.5,2.5 0 0 1 1216.9,269.2566 L1216.9,219.7683 A2.5,2.5 0 0 1 1219.4,217.2683" fill="#ECFCCB" style="stroke:#D1D5DB;stroke-width:0.5;"/><line style="stroke:#D1D5DB;stroke-width:0.5;" x1="1216.9" x2="1269.9" y1="238.2683" y2="238.2683"/><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.2061" x="1226.9" y="258.8034">webkit/</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="35" id="ent0012"><path d="M1355.35,224.1983 L1355.35,264.8194 L1640.6474,264.8194 L1640.6474,234.1983 L1630.6474,224.1983 L1355.35,224.1983" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:0.5;"/><path d="M1630.6474,224.1983 L1630.6474,234.1983 L1640.6474,234.1983 L1630.6474,224.1983" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:1;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.9692" x="1361.35" y="241.7666">A</text><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="53.9741" x="1374.4325" y="241.7666">persona</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.8169" x="1432.5199" y="241.7666">is the top-level identity.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.2974" x="1361.35" y="257.0772">It owns metadata + arbitrary sidecar files.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="40" id="ent0015"><path d="M1675.72,193.5783 L1675.72,295.4416 L1970.2722,295.4416 L1970.2722,203.5783 L1960.2722,193.5783 L1675.72,193.5783" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:0.5;"/><path d="M1960.2722,193.5783 L1960.2722,203.5783 L1970.2722,203.5783 L1960.2722,193.5783" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:1;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.5034" x="1681.72" y="211.1466">`default_url` is also the context's</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.0444" x="1681.72" y="226.4572">Playwright</text><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="56.3989" x="1750.8777" y="226.4572">base_url</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.543" x="1807.2766" y="226.4572">, so a macro can</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.6763" x="1681.72" y="241.7677">navigate `/orders` rather than an origin.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.5542" x="1681.72" y="257.0783">The macro is the BEHAVIOUR; the persona</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.5522" x="1681.72" y="272.3888">is the WHERE &#8212; swap persona to replay the</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.9868" x="1681.72" y="287.6994">same macro against another deployment.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="49" id="ent0018"><path d="M2005.75,208.8883 L2005.75,280.1305 L2426.2588,280.1305 L2426.2588,218.8883 L2416.2588,208.8883 L2005.75,208.8883" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:0.5;"/><path d="M2416.2588,208.8883 L2416.2588,218.8883 L2426.2588,218.8883 L2416.2588,208.8883" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:1;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="17.0371" x="2011.75" y="226.4566">An</text><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="93.6851" x="2032.9004" y="226.4566">engine profile</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.7622" x="2130.6987" y="226.4566">is `&lt;persona&gt;/&lt;kind&gt;/`.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.1748" x="2011.75" y="241.7672">This is what Playwright's `user_data_dir`</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="399.5088" x="2011.75" y="257.0777">points at when `browser_launch(profile=dante, kind=webkit)`.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.6631" x="2011.75" y="272.3883">Browser writes only here; octowright never touches it.</text></g><!--link DANTE to GMN11--><g class="link" data-entity-1="ent0002" data-entity-2="ent0012" data-link-type="association" data-source-line="35" id="lnk13"><path d="M1030.9864,187.6982 C1031.4502,185.452 1032.29,159.027 1032.8253,156.7723 C1033.8957,152.2628 1035.1137,147.7477 1036.4982,143.273 C1039.2672,134.3238 1042.7022,125.5361 1046.955,117.2777 C1055.4606,100.7608 1067.2375,86.3608 1083.5,77.0183 C1124.74,53.3383 1252.79,60.8083 1297.5,77.0183 C1379.36,106.7183 1451.21,186.0783 1482.02,223.9083" fill="none" id="DANTE-GMN11" style="stroke:#2563EB;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link DY to GMN14--><g class="link" data-entity-1="ent0003" data-entity-2="ent0015" data-link-type="association" data-source-line="40" id="lnk16"><path d="M207.66,209.6083 C234.01,168.9483 283.76,103.9083 346.5,77.0183 C412.58,48.6983 1573.51,50.9383 1640.5,77.0183 C1700.21,100.2683 1752.24,153.1883 1785.3,193.3783" fill="none" id="DY-GMN14" style="stroke:#2563EB;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link DW to GMN1