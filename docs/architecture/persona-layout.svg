entity TW--><polygon fill="#ECFCCB" filter="url(#f1lycl25jrc1sg)" points="1543.5,215.6258,1589.5,215.6258,1596.5,236.6258,1622.5,236.6258,1622.5,276.7617,1543.5,276.7617,1543.5,215.6258" style="stroke: #D1D5DB; stroke-width: 1.5;"/><line style="stroke: #D1D5DB; stroke-width: 1.5;" x1="1543.5" x2="1596.5" y1="236.6258" y2="236.6258"/><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="49" x="1553.5" y="258.5918">webkit/</text><path d="M1678.5,223.4858 L1678.5,268.8979 L1943.5,268.8979 L1943.5,233.4858 L1933.5,223.4858 L1678.5,223.4858 " fill="#F9FAFB" filter="url(#f1lycl25jrc1sg)" style="stroke: #D1D5DB; stroke-width: 1.0;"/><path d="M1933.5,223.4858 L1933.5,233.4858 L1943.5,233.4858 L1933.5,223.4858 " fill="#F9FAFB" style="stroke: #D1D5DB; stroke-width: 1.0;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="8" x="1684.5" y="242.3829">A</text><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="53" x="1695.5" y="242.3829">persona</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="139" x="1751.5" y="242.3829">is the top-level identity.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="244" x="1684.5" y="260.0889">It owns metadata + arbitrary sidecar files.</text><path d="M1978.5,188.0758 L1978.5,304.3119 L2259.5,304.3119 L2259.5,198.0758 L2249.5,188.0758 L1978.5,188.0758 " fill="#F9FAFB" filter="url(#f1lycl25jrc1sg)" style="stroke: #D1D5DB; stroke-width: 1.0;"/><path d="M2249.5,188.0758 L2249.5,198.0758 L2259.5,198.0758 L2249.5,188.0758 " fill="#F9FAFB" style="stroke: #D1D5DB; stroke-width: 1.0;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="192" x="1984.5" y="206.9729">`default_url` is also the context's</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="64" x="1984.5" y="224.6789">Playwright</text><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="54" x="2051.5" y="224.6789">base_url</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="95" x="2105.5" y="224.6789">, so a macro can</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="237" x="1984.5" y="242.3849">navigate `/orders` rather than an origin.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="252" x="1984.5" y="260.0909">The macro is the BEHAVIOUR; the persona</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="260" x="1984.5" y="277.7969">is the WHERE — swap persona to replay the</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="250" x="1984.5" y="295.5029">same macro against another deployment.</text><path d="M2294,188.0758 L2294,304.3119 L2632,304.3119 L2632,198.0758 L2622,188.0758 L2294,188.0758 " fill="#F9FAFB" filter="url(#f1lycl25jrc1sg)" style="stroke: #D1D5DB; stroke-width: 1.0;"/><path d="M2622,188.0758 L2622,198.0758 L2632,198.0758 L2622,188.0758 " fill="#F9FAFB" style="stroke: #D1D5DB; stroke-width: 1.0;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="242" x="2300" y="206.9729">Only when `trusted_roots` lists PEM files:</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="291" x="2300" y="224.6789">this persona's Chromium starts with HOME here,</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="297" x="2300" y="242.3849">so its private CA never reaches any other browser.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="317" x="2300" y="260.0909">Linux only (macOS/Windows Chromium reads the OS</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="290" x="2300" y="277.7969">store, so such a launch is refused). Not an engine</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="221" x="2300" y="295.5029">profile; never aged out as a stale one.</text><path d="M2666.5,205.7858 L2666.5,286.6099 L2965.5,286.6099 L2965.5,215.7858 L2955.5,205.7858 L2666.5,205.7858 " fill="#F9FAFB" filter="url(#f1lycl25jrc1sg)" style="stroke: #D1D5DB; stroke-width: 1.0;"/><path d="M2955.5,205.7858 L2955.5,215.7858 L2965.5,215.7858 L2955.5,205.7858 " fill="#F9FAFB" style="stroke: #D1D5DB; stroke-width: 1.0;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="273" x="2672.5" y="224.6829">`credentials`: `&lt;name&gt;_env`, `&lt;name&gt;_cmd` or</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="263" x="2672.5" y="242.3889">`&lt;name&gt;_file` (cmd &gt; file &gt; env). A `_file` must</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="278" x="2672.5" y="260.0949">be a regular, singly-linked, non-symlink file you</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="228" x="2672.5" y="277.8009">own with mode 600; POSIX hosts only.</text><path d="M3001,205.7858 L3001,286.6099 L3387,286.6099 L3387,215.7858 L3377,205.7858 L3001,205.7858 " fill="#F9FAFB" filter="url(#f1lycl25jrc1sg)" style="stroke: #D1D5DB; stroke-width: 1.0;"/><path d="M3377,205.7858 L3377,215.7858 L3387,215.7858 L3377,205.7858 " fill="#F9FAFB" style="stroke: #D1D5DB; stroke-width: 1.0;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="16" x="3007" y="224.6829">An</text><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="92" x="3026" y="224.6829">engine profile</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="136" x="3121" y="224.6829">is `&lt;persona&gt;/&lt;kind&gt;/`.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="237" x="3007" y="242.3889">This is what Playwright's `user_data_dir`</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="365" x="3007" y="260.0949">points at when `browser_launch(profile=dante, kind=webkit)`.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="321" x="3007" y="277.8009">Browser writes only here; octowright never touches it.</text><!--MD5=[9a47d612fe88f5e402bee57fe5ee4e1c]
