1.4379,220.3483 L1911.4379,230.3483 L1921.4379,230.3483 L1911.4379,220.3483" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:1;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="17.0371" x="1484.56" y="237.9166">An</text><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="93.6851" x="1505.7104" y="237.9166">engine profile</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.7622" x="1603.5087" y="237.9166">is `&lt;persona&gt;/&lt;kind&gt;/`.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.1748" x="1484.56" y="253.2272">This is what Playwright's `user_data_dir`</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="421.8779" x="1484.56" y="268.5377">points at when `browser_launch(profile=dante, kind=webkit)`.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.6631" x="1484.56" y="283.8483">Browser writes only here; octowright never touches it.</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="47" id="ent0019"><path d="M1154.78,359.1183 L1154.78,415.0499 L1545.2136,415.0499 L1545.2136,369.1183 L1535.2136,359.1183 L1154.78,359.1183" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:0.5;"/><path d="M1535.2136,359.1183 L1535.2136,369.1183 L1545.2136,369.1183 L1535.2136,359.1183" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:1;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.4336" x="1160.78" y="376.6866">Legacy layout was `profiles/&lt;kind&gt;/&lt;name&gt;/`. Migrated</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.7354" x="1160.78" y="391.9972">by the explicit `octowright migrate-profiles` command.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.7202" x="1160.78" y="407.3077">Idempotent and safe to re-run.</text></g><!--link DANTE to GMN12--><g class="link" data-entity-1="ent0003" data-entity-2="ent0013" data-link-type="association" data-source-line="35" id="lnk14"><path d="M803.3384,199.7872 C808.8646,160.2084 823.605,93.0983 859.5,72.4783 C909.99,43.4883 1067.83,49.9083 1121.5,72.4783 C1201.6,106.1783 1263.82,194.9983 1288.93,235.4183" fill="none" id="DANTE-GMN12" style="stroke:#2563EB;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link DW to GMN15--><g class="link" data-entity-1="ent0006" data-entity-2="ent0016" data-link-type="association" data-source-line="40" id="lnk17"><path d="M182.85,241.3683 C202.15,197.3283 241.76,103.3983 302.5,72.4783 C358.99,43.7183 1383.14,53.1183 1443.5,72.4783 C1533.95,101.5083 1619.62,175.4683 1665.44,220.1283" fill="none" id="DW-GMN15" style="stroke:#2563EB;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link ROOT to GMN18--><g class="link" data-entity-1="ent0002" data-entity-2="ent0019" data-link-type="association" data-source-line="47" id="lnk20"><path d="M1131.0673,291.9957 C1131.1044,292.0791 1131.1416,292.1624 1131.1789,292.2457 C1131.2537,292.4123 1131.3291,292.5787 1131.4052,292.7448 C1133.84,298.0608 1136.9725,303.1208 1141,307.2183 C1163.91,330.5083 1194.38,347.0183 1224.94,358.6783" fill="none" id="ROOT-GMN18" style="stroke:#2563EB;stroke-width:1;stroke-dasharray:7,7;"/></g></g></svg>