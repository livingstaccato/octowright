 0 0 0 587.71,230.4883" fill="#FEF3C7" style="stroke:#D1D5DB;stroke-width:0.5;"/><path d="M756.2832,227.9883 L756.2832,235.4883 A2.5,2.5 0 0 0 758.7832,237.9883 L766.2832,237.9883" fill="#FEF3C7" style="stroke:#D1D5DB;stroke-width:0.5;"/><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.0645" x="597.71" y="251.5234">avatar.png</text><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.5732" x="597.71" y="268.0117">(arbitrary persona files;</text><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.5352" x="597.71" y="284.5">octowright ignores)</text></g><!--entity DW--><g class="entity" data-qualified-name="ROOT.DANTE.DW" data-source-line="23" id="ent0005"><path d="M357.44,227.2283 L398.44,227.2283 A3.75,3.75 0 0 1 400.94,229.7283 L407.94,248.2283 L550.5699,248.2283 A2.5,2.5 0 0 1 553.0699,250.7283 L553.0699,295.7048 A2.5,2.5 0 0 1 550.5699,298.2048 L357.44,298.2048 A2.5,2.5 0 0 1 354.94,295.7048 L354.94,229.7283 A2.5,2.5 0 0 1 357.44,227.2283" fill="#ECFCCB" style="stroke:#D1D5DB;stroke-width:0.5;"/><line style="stroke:#D1D5DB;stroke-width:0.5;" x1="354.94" x2="407.94" y1="248.2283" y2="248.2283"/><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.2061" x="364.94" y="268.7634">webkit/</text><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.1299" x="364.94" y="285.2517">Playwright user-data-dir</text></g><!--entity DC--><g class="entity" data-qualified-name="ROOT.DANTE.DC" data-source-line="24" id="ent0006"><path d="M803.44,227.2283 L844.44,227.2283 A3.75,3.75 0 0 1 846.94,229.7283 L853.94,248.2283 L996.5699,248.2283 A2.5,2.5 0 0 1 999.0699,250.7283 L999.0699,295.7048 A2.5,2.5 0 0 1 996.5699,298.2048 L803.44,298.2048 A2.5,2.5 0 0 1 800.94,295.7048 L800.94,229.7283 A2.5,2.5 0 0 1 803.44,227.2283" fill="#ECFCCB" style="stroke:#D1D5DB;stroke-width:0.5;"/><line style="stroke:#D1D5DB;stroke-width:0.5;" x1="800.94" x2="853.94" y1="248.2283" y2="248.2283"/><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.4053" x="810.94" y="268.7634">chromium/</text><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.1299" x="810.94" y="285.2517">Playwright user-data-dir</text></g><!--entity DF--><g class="entity" data-qualified-name="ROOT.DANTE.DF" data-source-line="25" id="ent0007"><path d="M580.44,373.6483 L621.44,373.6483 A3.75,3.75 0 0 1 623.94,376.1483 L630.94,394.6483 L773.5699,394.6483 A2.5,2.5 0 0 1 776.0699,397.1483 L776.0699,442.1248 A2.5,2.5 0 0 1 773.5699,444.6248 L580.44,444.6248 A2.5,2.5 0 0 1 577.94,442.1248 L577.94,376.1483 A2.5,2.5 0 0 1 580.44,373.6483" fill="#ECFCCB" style="stroke:#D1D5DB;stroke-width:0.5;"/><line style="stroke:#D1D5DB;stroke-width:0.5;" x1="577.94" x2="630.94" y1="394.6483" y2="394.6483"/><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.3975" x="587.94" y="415.1834">firefox/</text><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.1299" x="587.94" y="431.6717">Playwright user-data-dir</text></g><!--entity TY--><g class="entity" data-qualified-name="ROOT.TIM.TY" data-source-line="29" id="ent0009"><path d="M1089.61,246.9783 L1089.61,278.4666 A2.5,2.5 0 0 0 1092.11,280.9666 L1187.8834,280.9666 A2.5,2.5 0 0 0 1190.3834,278.4666 L1190.3834,254.4783 L1180.3834,244.4783 L1092.11,244.4783 A2.5,2.5 0 0 0 1089.61,246.9783" fill="#FEF3C7" style="stroke:#D1D5DB;stroke-width:0.5;"/><path d="M1180.3834,244.4783 L1180.3834,251.9783 A2.5,2.5 0 0 0 1182.8834,254.4783 L1190.3834,254.4783" fill="#FEF3C7" style="stroke:#D1D5DB;stroke-width:0.5;"/><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7734" x="1099.61" y="268.0134">profile.yaml</text></g><!--entity TW--><g class="entity" data-qualified-name="ROOT.TIM.TW" data-source-line="30" id="ent0010"><path d="M1227.4,235.4783 L1268.4,235.4783 A3.75,3.75 0 0 1 1270.9,237.9783 L1277.9,256.4783 L1304.6061,256.4783 A2.5,2.5 0 0 1 1307.1061,258.9783 L1307.1061,287.4666 A2.5,2.5 0 0 1 1304.6061,289.9666 L1227.4,289.9666 A2.5,2.5 0 0 1 1224.9,287.4666 L1224.9,237.9783 A2.5,2.5 0 0 1 1227.4,235.4783" fill="#ECFCCB" style="stroke:#D1D5DB;stroke-width:0.5;"/><line style="stroke:#D1D5DB;stroke-width:0.5;" x1="1224.9" x2="1277.9" y1="256.4783" y2="256.4783"/><text fill="#333333" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.2061" x="1234.9" y="277.0134">webkit/</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="35" id="ent0012"><path d="M1390.35,242.4083 L1390.35,283.0294 L1675.6474,283.0294 L1675.6474,252.4083 L1665.6474,242.4083 L1390.35,242.4083" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:0.5;"/><path d="M1665.6474,242.4083 L1665.6474,252.4083 L1675.6474,252.4083 L1665.6474,242.4083" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:1;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.9692" x="1396.35" y="259.9766">A</text><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="53.9741" x="1409.4325" y="259.9766">persona</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.8169" x="1467.5199" y="259.9766">is the top-level identity.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.2974" x="1396.35" y="275.2872">It owns metadata + arbitrary sidecar files.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="40" id="ent0015"><path d="M1710.72,211.7883 L1710.72,313.6516 L2005.2722,313.6516 L2005.2722,221.7883 L1995.2722,211.7883 L1710.72,211.7883" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:0.5;"/><path d="M1995.2722,211.7883 L1995.2722,221.7883 L2005.2722,221.7883 L1995.2722,211.7883" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:1;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.5034" x="1716.72" y="229.3566">`default_url` is also the context's</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.0444" x="1716.72" y="244.6672">Playwright</text><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="56.3989" x="1785.8777" y="244.6672">base_url</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.543" x="1842.2766" y="244.6672">, so a macro can</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.6763" x="1716.72" y="259.9777">navigate `/orders` rather than an origin.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.5542" x="1716.72" y="275.2883">The macro is the BEHAVIOUR; the persona</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.5522" x="1716.72" y="290.5988">is the WHERE &#8212; swap persona to replay the</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.9868" x="1716.72" y="305.9094">same macro against another deployment.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="49" id="ent0018"><path d="M2040.75,227.0983 L2040.75,298.3405 L2461.2588,298.3405 L2461.2588,237.0983 L2451.2588,227.0983 L2040.75,227.0983" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:0.5;"/><path d="M2451.2588,227.0983 L2451.2588,237.0983 L2461.2588,237.0983 L2451.2588,227.0983" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:1;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="17.0371" x="2046.75" y="244.6666">An</text><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="93.6851" x="2067.9004" y="244.6666">engine profile</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.7622" x="2165.6987" y="244.6666">is `&lt;persona&gt;/&lt;kind&gt;/`.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.1748" x="2046.75" y="259.9772">This is what Playwright's `user_data_dir`</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="399.5088" x="2046.75" y="275.2877">points at when `browser_launch(profile=dante, kind=webkit)`.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.6631" x="2046.75" y="290.5983">Browser writes only here; octowright never touches it.</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="56" id="ent0021"><path d="M1386.78,381.1783 L1386.78,437.1099 L1777.2136,437.1099 L1777.2136,391.1783 L1767.2136,381.1783 L1386.78,381.1783" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:0.5;"/><path d="M1767.2136,381.1783 L1767.2136,391.1783 L1777.2136,391.1783 L1767.2136,381.1783" fill="#F9FAFB" style="stroke:#D1D5DB;stroke-width:1;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.4336" x="1392.78" y="398.7466">Legacy layout was `profiles/&lt;kind&gt;/&lt;name&gt;/`. Migrated</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.7354" x="1392.78" y="414.0572">by the explicit `octowright migrate-profiles` command.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.7202" x="1392.78" y="429.3677">Idempotent and safe to re-run.</text></g><!--link DANTE to GMN11--><g class="link" data-entity-1="ent0002" data-entity-2="ent0012" data-link-type="association" data-source-line="35" id="lnk13"><path d="M1035.3384,206.5372 C1040.8646,166.9584 1055.605,99.8483 1091.5,79.2283 C1141.99,50.2383 1299.83,56.6583 1353.5,79.2283 C1433.6,112.9283 1495.82,201.7483 1520.93,242.1683" fill="none" id="DANTE-GMN11" style="stroke:#2563EB;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link DY to GMN14--><g class="link" data-entity-1="ent0003" data-entity-2="ent0015" data-link-type="association" data-source-line="40" id="lnk16"><path d="M213.04,227.6783 C238,183.5083 287.67,109.6883 354.5,79.2283 C421.28,48.7983 1607.74,51.0583 1675.5,79.2283 C1739.6,105.8783 1792.8,167.1983 1824.91,211.6283" fill="none" id="DY-GMN14" style="stroke:#2563EB;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link DW to GMN17--><g class="link" data-entity-1="ent0005" data-entity-2="ent0018" data-link-type="association" data-source-line="49" id="lnk19"><path d="M467.85,248.1183 C487.15,204.0783 526.76,110.1483 587.5,79.2283 C657.7,43.4883 1930.74,54.3783 2005.5,79.2283 C2093.11,108.3483 2174.73,182.2783 2218.24,226.9083" fill="none" id="DW-GMN17" style="stroke:#2563EB;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link ROOT to GMN20--><g class="link" data-entity-1="ent0001" data-entity-2="ent0021" data-link-type="association" data-source-line="56" id="lnk22"><path d="M1363.0765,298.0284 C1363.1125,298.1123 1363.1487,298.1962 1363.1851,298.28 C1363.3305,298.6154 1363.4784,298.9501 1363.6289,299.2839 C1366.0369,304.6252 1369.1025,309.7483 1373,313.9683 C1401.49,344.8083 1441.99,366.2283 1479.77,380.7483" fill="none" id="ROOT-GMN20" style="stroke:#2563EB;stroke-width:1;stroke-dasharray:7,7;"/></g></g></svg>