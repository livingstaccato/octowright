<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="523px" preserveAspectRatio="none" style="width:2476px;height:523px;background:#FFFFFF;" version="1.1" viewBox="0 0 2476 523" width="2476px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="5"><text fill="#333333" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="298.4365" x="1085.4111" y="23.5352">On-disk persona layout (post-migration)</text></g><!--cluster ROOT--><g class="cluster" data-qualified-name="ROOT" data-source-line="19" id="ent0001"><path d="M8.5,125.2283 L235.4414,125.2283 A3.75,3.75 0 0 1 237.9414,127.7283 L244.9414,147.7166 L1360.5,147.7166 A2.5,2.5 0 0 1 1363,150.2166 L1363,506.1283 A2.5,2.5 0 0 1 1360.5,508.6283 L8.5,508.6283 A2.5,2.5 0 0 1 6,506.1283 L6,127.7283 A2.5,2.5 0 0 1 8.5,125.2283" fill="#FFFFFF" style="stroke:#D1D5DB;stroke-width:1.5;"/><line style="stroke:#D1D5DB;stroke-width:1.5;" x1="6" x2="244.9414" y1="147.7166" y2="147.7166"/><text fill="#333333" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="225.9414" x="10" y="140.7634">&lt;octowright-config&gt;/profiles/</text></g><!--cluster DANTE--><g class="cluster" data-qualified-name="ROOT.DANTE" data-source-line="20" id="ent0002"><path d="M48.5,184.2283 L97.9941,184.2283 A3.75,3.75 0 0 1 100.4941,186.7283 L107.4941,206.7166 L1039.5,206.7166 A2.5,2.5 0 0 1 1042,209.2166 L1042,466.1283 A2.5,2.5 0 0 1 1039.5,468.6283 L48.5,468.6283 A2.5,2.5 0 0 1 46,466.1283 L46,186.7283 A2.5,2.5 0 0 1 48.5,184.2283" fill="#FFFFFF" style="stroke:#D1D5DB;stroke-width:1.5;"/><line style="stroke:#D1D5DB;stroke-width:1.5;" x1="46" x2="107.4941" y1="206.7166" y2="206.7166"/><text fill="#333333" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="48.4941" x="50" y="199.7634">dante/</text></g><!--cluster